<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Vedanta Security Exam Portal — VSES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0A0F1C;
  --bg-2:#0D1424;
  --panel:#121A2E;
  --panel-2:#182238;
  --line:#232F49;
  --line-2:#2C3A5A;
  --text:#EAEFF9;
  --muted:#8C99B8;
  --muted-2:#5F6C8C;
  --amber:#F0A93B;
  --amber-soft:rgba(240,169,59,.14);
  --green:#3FBF7F;
  --green-soft:rgba(63,191,127,.14);
  --red:#E5636B;
  --red-soft:rgba(229,99,107,.14);
  --blue:#5B8DEF;
  --glass:rgba(18,26,46,.7);
  --radius:12px;
  --radius-sm:8px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --font-dev:'Noto Sans Devanagari','Inter',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
}
/* Light theme — toggled site-wide from Admin → Site Settings (sets
   data-theme="light" on <html>; default with no attribute is dark). */
html[data-theme="light"]{
  --bg:#F3F5FA;
  --bg-2:#FFFFFF;
  --panel:#FFFFFF;
  --panel-2:#F0F3F9;
  --line:#E1E6F0;
  --line-2:#CBD3E3;
  --text:#131A2C;
  --muted:#5B6B8C;
  --muted-2:#8593AD;
  --amber:#DB901F;
  --amber-soft:rgba(219,144,31,.14);
  --green:#1F9D5D;
  --green-soft:rgba(31,157,93,.12);
  --red:#D64550;
  --red-soft:rgba(214,69,80,.12);
  --blue:#3B6FE0;
  --glass:rgba(255,255,255,.75);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
[lang-hi]{font-family:var(--font-dev);}
#app{min-height:100vh;display:flex;flex-direction:column;}
::selection{background:var(--amber-soft);}
a{color:inherit;}
button{font-family:inherit;}
.wrap{max-width:none;margin:0 auto;padding:0 clamp(16px,3vw,56px);width:100%;}
.wrap-narrow{max-width:640px;margin:0 auto;padding:0 20px;width:100%;}

/* ---- topbar ---- */
.topbar{
  border-bottom:1px solid var(--line);
  background:var(--panel);
  position:sticky;top:0;z-index:20;
}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:14px clamp(16px,3vw,56px);max-width:none;margin:0 auto;}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;font-size:16px;user-select:none;-webkit-user-select:none;-moz-user-select:none;}
.brand-dot{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px var(--amber-soft);flex-shrink:0;}
.brand small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:1px;}
.session-chip{display:flex;align-items:center;gap:10px;}
.session-chip .who{text-align:right;line-height:1.25;}
.session-chip .who b{font-size:13px;display:block;}
.session-chip .who span{font-size:11px;color:var(--muted);font-family:var(--font-mono);}
.btn{
  border:1px solid var(--line-2);
  background:var(--panel-2);
  color:var(--text);
  padding:9px 16px;
  border-radius:var(--radius-sm);
  font-size:13.5px;
  font-weight:600;
  cursor:pointer;
  transition:.15s border-color, .15s background, .15s transform;
  display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{border-color:var(--amber);}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--amber);border-color:var(--amber);color:#211404;}
.btn-primary:hover{background:#f5b658;border-color:#f5b658;}
.btn-primary:disabled{background:var(--panel-2);border-color:var(--line);color:var(--muted-2);cursor:not-allowed;}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted);}
.btn-ghost:hover{color:var(--text);border-color:var(--line-2);}
.btn-danger{border-color:var(--red);color:var(--red);background:transparent;}
.btn-danger:hover{background:var(--red-soft);}
.icon-del-btn{
  width:30px;height:30px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--red);color:#fff;border:none;cursor:pointer;
  transition:.15s background,.15s transform;
}
.icon-del-btn:hover{background:#c94951;}
.icon-del-btn:active{transform:scale(.92);}
.icon-del-btn .ic{width:14px;height:14px;}
.name-link{color:var(--amber);cursor:pointer;text-decoration:none;font-weight:600;}
.name-link:hover{text-decoration:underline;}
.btn-icon{padding:7px 9px;display:inline-flex;align-items:center;justify-content:center;}
.btn-sm{padding:6px 11px;font-size:12.5px;}
.btn-block{width:100%;justify-content:center;}

main{flex:1;padding:32px 0 60px;}

/* ---- hero / role select ---- */
.hero{padding:56px 0 20px;text-align:center;}
.hero h1{font-size:34px;margin:0 0 10px;font-weight:800;letter-spacing:-.5px;}
.hero p{color:var(--muted);font-size:15px;margin:0 auto;max-width:480px;line-height:1.55;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:36px;}
@media (max-width:560px){.role-grid{grid-template-columns:1fr;}}
.role-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px 22px;text-align:left;cursor:pointer;transition:.15s border-color,.15s transform;
}
.role-card:hover{border-color:var(--amber);transform:translateY(-2px);}
.role-card .icon{width:40px;height:40px;border-radius:10px;background:var(--amber-soft);display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:14px;}
.role-card h3{margin:0 0 6px;font-size:17px;}
.role-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.5;}

/* ---- card / panel ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.panel-head h2{margin:0;font-size:19px;}
.panel-head p{margin:2px 0 0;color:var(--muted);font-size:13px;}

/* ---- tabs ---- */
.tabs{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:4px;margin-bottom:22px;}
.tab{flex:1;text-align:center;padding:8px 10px;border-radius:6px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted);}
.tab.active{background:var(--amber);color:#211404;}

/* ---- form ---- */
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;}
.field input,.field select,.field textarea{
  width:100%;background:var(--bg-2);border:1px solid var(--line-2);color:var(--text);
  padding:11px 12px;border-radius:var(--radius-sm);font-size:14.5px;font-family:inherit;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--amber);outline-offset:0;border-color:var(--amber);}
.field .hint{font-size:11.5px;color:var(--muted-2);margin-top:5px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:520px){.field-row{grid-template-columns:1fr;}}
.error-box{background:var(--red-soft);border:1px solid var(--red);color:#ffb3b7;padding:10px 13px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:16px;}
.info-box{background:var(--amber-soft);border:1px solid var(--amber);color:var(--text);padding:10px 13px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:16px;}

/* ---- month/exam grid ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.tile{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;cursor:pointer;transition:.15s border-color,.15s transform;text-align:left;
}
.tile:hover{border-color:var(--amber);transform:translateY(-2px);}
.tile .tile-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.tile .month-icon{width:34px;height:34px;border-radius:8px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-size:16px;}
.tile h3{margin:0 0 4px;font-size:16px;}
.tile .sub{color:var(--muted);font-size:12.5px;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.2px;}
.badge-pending{background:var(--panel-2);color:var(--muted);border:1px solid var(--line-2);}
.badge-done{background:var(--green-soft);color:var(--green);}
.badge-locked{background:var(--red-soft);color:var(--red);}
.badge-open{background:var(--amber-soft);color:var(--amber);}

.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-bottom:18px;flex-wrap:wrap;}
.crumb a{color:var(--muted);cursor:pointer;text-decoration:none;}
.crumb a:hover{color:var(--amber);}

/* ---- exam runner ---- */
.exam-read{ max-width:860px; margin:0 auto; }
.exam-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.progress-track{height:6px;background:var(--panel-2);border-radius:4px;overflow:hidden;margin:14px 0 26px;}
.progress-fill{height:100%;background:var(--amber);transition:width .2s;}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 20px 18px;margin-bottom:14px;}
.qcard.answered{border-color:var(--line-2);}
.qnum{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;background:var(--panel-2);font-family:var(--font-mono);font-size:12.5px;font-weight:600;color:var(--muted);margin-right:10px;flex-shrink:0;}
.qtext{font-size:15.5px;font-weight:600;line-height:1.5;display:flex;gap:2px;align-items:flex-start;}
.qimg{max-width:100%;border-radius:8px;margin:12px 0 4px;display:block;border:1px solid var(--line);}
.opt-list{margin-top:14px;display:flex;flex-direction:column;gap:9px;}
.opt-list.opt-images{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (max-width:480px){.opt-list.opt-images{grid-template-columns:1fr;}}
.opt{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:var(--radius-sm);
  border:1px solid var(--line-2);background:var(--bg-2);cursor:pointer;font-size:14px;transition:.12s border-color,.12s background;
}
.opt:hover{border-color:var(--amber);}
.opt.selected{border-color:var(--amber);background:var(--amber-soft);}
.opt.correct{border-color:var(--green);background:var(--green-soft);}
.opt.wrong{border-color:var(--red);background:var(--red-soft);}
.opt .letter{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0;font-family:var(--font-mono);}
.opt.selected .letter{border-color:var(--amber);background:var(--amber);color:#211404;}
.opt.correct .letter{border-color:var(--green);background:var(--green);color:#062814;}
.opt.wrong .letter{border-color:var(--red);background:var(--red);color:#2b0709;}
.opt img{width:100%;border-radius:6px;display:block;margin-top:4px;}
.opt-images .opt{flex-direction:column;align-items:stretch;}
.opt-images .opt .letter{align-self:flex-start;margin-bottom:2px;}
.lang-toggle{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:3px;}
.lang-toggle button{border:none;background:transparent;color:var(--muted);padding:6px 14px;border-radius:16px;font-size:12.5px;font-weight:700;cursor:pointer;}
.lang-toggle button.active{background:var(--amber);color:#211404;}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.switch input{position:absolute;opacity:0;width:0;height:0;}
.switch-track{width:42px;height:24px;border-radius:999px;background:var(--line-2);position:relative;transition:.2s background;flex-shrink:0;}
.switch-track::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s transform;}
.switch input:checked + .switch-track{background:var(--green);}
.switch input:checked + .switch-track::after{transform:translateX(18px);}
.switch-label{font-size:13.5px;font-weight:600;color:var(--text);}
.field label.switch{display:inline-flex;margin-bottom:0;}

/* ---- result ---- */
.result-hero{text-align:center;padding:40px 20px;}
.score-ring{width:140px;height:140px;border-radius:50%;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;flex-direction:column;border:6px solid var(--line);position:relative;}
.score-ring .num{font-size:34px;font-weight:800;font-family:var(--font-mono);}
.score-ring .den{font-size:12px;color:var(--muted);}

/* ---- table ---- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px;}
thead th{text-align:left;padding:11px 14px;background:var(--panel-2);color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);white-space:nowrap;}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--panel-2);}
.mono{font-family:var(--font-mono);}
.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty .icon{font-size:34px;margin-bottom:10px;}

/* ---- admin layout ---- */
.admin-layout{display:block;}

/* Logo itself is the sidebar trigger for admins (no separate button). */
.brand-clickable{cursor:pointer;border-radius:var(--radius-sm);padding:4px 8px;margin:-4px -8px;transition:.15s background;}
.brand-clickable:hover,.brand-clickable:focus-visible{background:var(--panel-2);outline:none;}

/* Sidebar sits strictly between the header and footer bars — its top is
   pinned to the measured header height (--hdr-h, set from JS) and it
   never overlaps either bar: both the header (z-index 20) and the
   footer (z-index 16) are stacked above it (z-index 15). It slides in
   left→right on open and reverses right→left on close, with a slow,
   clearly-visible motion. There is no dimming backdrop and nothing is
   ever disabled underneath — instead, the open section itself shrinks
   to fit the remaining width (see main.admin-sidebar-open below) and
   stays fully usable while the sidebar is open. */
.admin-sidebar{
  position:fixed;left:0;top:var(--hdr-h,64px);height:calc(100vh - var(--hdr-h,64px));
  width:var(--sidebar-w,272px);max-width:84vw;
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:15;
  transform:translateX(-100%);transition:transform .55s cubic-bezier(.22,.61,.36,1);
  box-shadow:0 0 70px rgba(0,0,0,.45);
}
.admin-sidebar.open{transform:translateX(0);}
.admin-nav{display:flex;flex-direction:column;gap:2px;padding:14px 10px;overflow-y:auto;}
.admin-nav button{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:none;color:var(--muted);
  padding:11px 12px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:.2s background,.2s color;
}
.admin-nav button .ic{
  width:34px;height:34px;flex-shrink:0;border-radius:9px;background:var(--panel-2);color:var(--muted);
  display:flex;align-items:center;justify-content:center;transition:.2s background,.2s color;
}
.admin-nav button .ic svg{width:16px;height:16px;}
.admin-nav button:hover{background:var(--panel-2);color:var(--text);}
.admin-nav button:hover .ic{background:var(--line-2);color:var(--text);}
.admin-nav button.active{background:var(--amber-soft);color:var(--amber);}
.admin-nav button.active .ic{background:var(--amber);color:#211404;}

/* The open section shrinks to fit beside the sidebar (same slow motion,
   so both move together) instead of being covered or disabled; it
   returns to full width the moment the sidebar closes. */
main{transition:margin-left .55s cubic-bezier(.22,.61,.36,1);}
body.admin-sidebar-open main{margin-left:var(--sidebar-w,272px);}


.item-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;
  border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:10px;background:var(--panel-2);
}
.item-row .info b{display:block;font-size:14.5px;margin-bottom:2px;}
.item-row .info span{color:var(--muted);font-size:12px;}
.item-row .actions{display:flex;gap:8px;flex-shrink:0;}

.q-edit-row{border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;background:var(--panel-2);}
.q-edit-row .qtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.q-edit-row .qtop b{font-size:14px;}
.q-edit-row .opts-preview{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--panel);border:1px solid var(--line-2);color:var(--muted);}
.chip.right{border-color:var(--green);color:var(--green);}

.opt-builder{border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;background:var(--bg-2);}
.opt-builder-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.opt-builder-top label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;cursor:pointer;}
.img-drop{border:1.5px dashed var(--line-2);border-radius:8px;padding:14px;text-align:center;font-size:12.5px;color:var(--muted);cursor:pointer;}
.img-drop img{max-width:100%;max-height:90px;border-radius:6px;margin-top:8px;}

.search-box{display:flex;gap:10px;margin-bottom:20px;}
.search-box input{
  flex:1;background:var(--bg-2);border:1px solid var(--line-2);color:var(--text);
  padding:11px 12px;border-radius:var(--radius-sm);font-size:14.5px;font-family:inherit;
}
.search-box input:focus{outline:2px solid var(--amber);outline-offset:0;border-color:var(--amber);}

.divider{height:1px;background:var(--line);margin:22px 0;}

/* ---- compact admin controls: inputs / dropdowns / search boxes used to
   stretch across the whole wide card. Cap them so the admin panel looks tidy. ---- */
.admin-layout .field select{max-width:300px;}
.admin-layout .field input[type=text],
.admin-layout .field input[type=tel],
.admin-layout .field input[type=email],
.admin-layout .field input[type=password],
.admin-layout .field input[type=number],
.admin-layout .field input[type=search]{max-width:340px;}
.admin-layout .field.field-wide input[type=text]{max-width:520px;}
.admin-layout .field textarea{max-width:720px;}
.admin-layout .field-row{grid-template-columns:repeat(auto-fit,minmax(180px,280px));}
.admin-layout .opt-builder .field input[type=text]{max-width:none;}
.admin-layout .opt-builder .field-row{grid-template-columns:1fr 1fr;}
@media (max-width:520px){.admin-layout .opt-builder .field-row{grid-template-columns:1fr;}}
.admin-layout .search-box{max-width:380px;}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
@media (max-width:600px){.stat-row{grid-template-columns:1fr 1fr;}}
.stat-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px;}
.stat-box .n{font-size:22px;font-weight:800;font-family:var(--font-mono);}
.stat-box .l{font-size:11.5px;color:var(--muted);margin-top:3px;}
.stat-box.clickable{cursor:pointer;transition:.15s border-color,.15s transform;}
.stat-box.clickable:hover{border-color:var(--amber);}
.stat-box.clickable:active{transform:scale(.98);}
.stat-row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:0;}
@media (max-width:600px){.stat-row-3{grid-template-columns:1fr;}}
select.select-inline{width:auto;display:inline-block;}
.toggle-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;color:var(--muted);}

/* ---- minimalist icons ---- */
.ic{display:inline-flex;align-items:center;justify-content:center;width:var(--ic-size,18px);height:var(--ic-size,18px);flex-shrink:0;}
.ic svg{width:100%;height:100%;}
.brand-icon{width:26px;height:26px;border-radius:8px;background:var(--amber-soft);color:var(--amber);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-icon .ic{width:15px;height:15px;}
.role-card .icon{color:var(--amber);}
.admin-nav button .ic{color:inherit;}
.tile .month-icon{color:var(--amber);}

/* ---- password show/hide ---- */
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:40px;}
.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--muted);cursor:pointer;padding:8px;display:flex;align-items:center;justify-content:center;border-radius:6px;}
.pw-eye:hover{color:var(--text);}
.pw-eye .ic{width:17px;height:17px;}

/* ---- exam language mode selector ---- */
.qlang-select{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:3px;flex-shrink:0;}
.qlang-select button{border:none;background:transparent;color:var(--muted);padding:6px 12px;border-radius:16px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
.qlang-select button.active{background:var(--amber);color:#211404;}
.crumb-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.crumb-row .crumb{margin-bottom:0;}

/* ---- month tile notification badge ---- */
.tile{position:relative;}
.notif-badge{
  display:flex;align-items:center;gap:5px;background:var(--red-soft);color:var(--red);
  border:1px solid var(--red);padding:3px 9px 3px 7px;border-radius:20px;font-size:11px;font-weight:700;
  font-family:var(--font-mono);flex-shrink:0;
}
.notif-badge .ic{width:13px;height:13px;}

/* ---- exam completed tick (replaces old "Locked" text badge) ---- */
.done-tick{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;
  background:var(--green);color:#0b2416;flex-shrink:0;
}
.done-tick .ic{width:12px;height:12px;}

/* ---- month lock/unlock (admin toggle + guard-side indicator) ---- */
.lock-toggle{
  border:1px solid var(--line-2);background:var(--panel-2);border-radius:var(--radius-sm);
  padding:7px 9px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  transition:.15s border-color,.15s color,.15s background;
}
.lock-toggle .ic{width:15px;height:15px;}
.lock-toggle.is-locked{color:var(--red);border-color:var(--red);background:var(--red-soft);}
.lock-toggle.is-unlocked{color:var(--green);border-color:var(--green);background:var(--green-soft);}
.lock-toggle:disabled{opacity:.6;cursor:not-allowed;}
.tile.tile-locked{cursor:not-allowed;opacity:.72;}
.tile.tile-locked:hover{border-color:var(--line);transform:none;}
.month-lock-badge{
  display:flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:50%;
  background:var(--red-soft);color:var(--red);border:1px solid var(--red);flex-shrink:0;
}
.month-lock-badge .ic{width:13px;height:13px;}

/* ---- exam security mode (no copy / screenshot deterrent) ---- */
body.secure-mode, body.secure-mode *{
  -webkit-user-select:none!important;-moz-user-select:none!important;-ms-user-select:none!important;user-select:none!important;
  -webkit-touch-callout:none!important;
}
body.secure-mode ::selection{background:transparent;}
body.secure-mode img{-webkit-user-drag:none;user-drag:none;pointer-events:none;}
body.secure-mode #app{filter:none;transition:filter .12s ease;}
body.secure-mode.secure-blurred #app{filter:blur(22px) saturate(0.6);pointer-events:none;}
.secure-overlay{
  position:fixed;inset:0;z-index:9999;display:none;
  align-items:center;justify-content:center;text-align:center;
  background:rgba(10,15,28,.72);backdrop-filter:blur(2px);padding:24px;
}
body.secure-mode.secure-blurred .secure-overlay{display:flex;}
.secure-overlay-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 26px;max-width:320px;font-size:13.5px;color:var(--text);line-height:1.5;
}
.secure-overlay-card b{display:block;margin-bottom:6px;color:var(--red);font-size:14px;}
@media print{ body.secure-mode #app, body.secure-mode .topbar, body.secure-mode footer{ display:none!important; } }

/* ---- admin action confirmation popup ---- */
#confirmToastHost{
  position:fixed; left:50%; top:22px; z-index:10000;
  transform:translateX(-50%);
  pointer-events:none;
}
.confirm-toast{
  display:flex; align-items:center; gap:10px;
  background:var(--panel-2);
  border:1px solid var(--green);
  box-shadow:0 10px 30px rgba(0,0,0,.35), 0 0 0 4px var(--green-soft);
  border-radius:999px;
  padding:10px 18px 10px 12px;
  color:var(--text);
  font-size:13.5px;
  font-weight:600;
  white-space:nowrap;
  cursor:pointer;
  pointer-events:auto;
  opacity:0;
  transform:translateY(-14px) scale(.96);
  transition:opacity .22s ease, transform .22s cubic-bezier(.34,1.56,.64,1);
}
.confirm-toast.confirm-toast-show{ opacity:1; transform:translateY(0) scale(1); }
.confirm-toast.confirm-toast-hide{ opacity:0; transform:translateY(-10px) scale(.97); }
.confirm-toast-danger{ border-color:var(--red); box-shadow:0 10px 30px rgba(0,0,0,.35), 0 0 0 4px var(--red-soft); }
.confirm-toast-icon{
  display:flex; align-items:center; justify-content:center;
  width:26px; height:26px; border-radius:50%; flex-shrink:0;
  background:var(--green-soft);
}
.confirm-toast-danger .confirm-toast-icon{ background:var(--red-soft); }
.confirm-toast-icon svg{ display:block; }
.ct-circle{
  stroke:var(--green); stroke-width:3;
  stroke-dasharray:145; stroke-dashoffset:145;
  animation:ctCircle .45s ease forwards;
}
.confirm-toast-danger .ct-circle{ stroke:var(--red); }
.ct-check{
  stroke:var(--green); stroke-width:4.5; stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:34; stroke-dashoffset:34;
  animation:ctCheck .3s .35s ease forwards;
}
.confirm-toast-danger .ct-check{ stroke:var(--red); }
@keyframes ctCircle{ to{ stroke-dashoffset:0; } }
@keyframes ctCheck{ to{ stroke-dashoffset:0; } }
@media (max-width:480px){
  .confirm-toast{ font-size:12.5px; padding:9px 14px 9px 10px; max-width:88vw; white-space:normal; }
}

/* ================= PROFESSIONAL VISUAL REFRESH + MOTION ================= */

/* Page transition — replays only when the visible screen actually changes
   (not on every keystroke or answer click), so search boxes and the exam
   runner stay flicker-free. */
@keyframes pageEnter{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:translateY(0); }
}
.page-enter{ animation:pageEnter .42s cubic-bezier(.22,.9,.32,1) both; }

/* Depth background */
body{
  background:
    radial-gradient(1100px 560px at 12% -8%, rgba(240,169,59,.09), transparent 60%),
    radial-gradient(900px 520px at 108% 8%, rgba(91,141,239,.08), transparent 55%),
    var(--bg);
}

/* Topbar — glass blur + gradient underline */
.topbar{
  background:var(--glass);
  backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
}
.topbar::after{
  content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px;
  background:linear-gradient(90deg, transparent, var(--amber) 20%, var(--blue) 55%, transparent 90%);
  opacity:.6;
}
.brand-icon{
  background:linear-gradient(140deg, #f5b658, var(--amber));
  color:#211404;
  box-shadow:0 0 0 4px var(--amber-soft), 0 4px 14px rgba(240,169,59,.25);
  transition:transform .25s ease, box-shadow .25s ease;
}
.brand:hover .brand-icon{ transform:rotate(-8deg) scale(1.06); box-shadow:0 0 0 5px var(--amber-soft), 0 6px 18px rgba(240,169,59,.35); }

/* Buttons — gradient + glow + shine sweep on hover */
.btn{ position:relative; overflow:hidden; transition:.18s border-color, .18s background, .18s transform, .18s box-shadow; }
.btn-primary{
  background:linear-gradient(135deg, #f5b658, var(--amber));
  box-shadow:0 2px 10px rgba(240,169,59,.22);
}
.btn-primary:hover{ box-shadow:0 6px 18px rgba(240,169,59,.4); transform:translateY(-1px); }
.btn-primary::before{
  content:''; position:absolute; inset:0;
  background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.35) 48%, transparent 66%);
  transform:translateX(-120%); transition:transform .5s ease;
}
.btn-primary:hover::before{ transform:translateX(120%); }
.btn:active{ transform:scale(.97); }

/* Cards, tiles, role cards — soft depth + lift/glow on hover */
.card{ box-shadow:0 1px 0 rgba(255,255,255,.02) inset, 0 10px 28px rgba(0,0,0,.18); transition:.2s border-color, .2s box-shadow; }
.tile, .role-card{ box-shadow:0 6px 18px rgba(0,0,0,.16); transition:.2s border-color, .22s transform, .22s box-shadow; }
.tile:hover, .role-card:hover{ box-shadow:0 14px 32px rgba(0,0,0,.28), 0 0 0 1px var(--amber-soft); }
.role-card{ position:relative; overflow:hidden; }
.role-card::after{
  content:''; position:absolute; inset:0; pointer-events:none; opacity:0;
  background:radial-gradient(220px 140px at 30% 0%, rgba(240,169,59,.14), transparent 70%);
  transition:opacity .3s ease;
}
.role-card:hover::after{ opacity:1; }
.role-card .icon{
  background:linear-gradient(135deg, var(--amber-soft), rgba(240,169,59,.28));
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.role-card:hover .icon{ transform:scale(1.1) rotate(-4deg); }

/* Hero — floating gradient blobs + gradient headline */
.hero{ position:relative; }
.hero::before, .hero::after{
  content:''; position:absolute; z-index:-1; border-radius:50%; filter:blur(60px); opacity:.5;
  animation:heroFloat 9s ease-in-out infinite;
}
.hero::before{ width:280px; height:280px; background:var(--amber); top:-40px; left:10%; }
.hero::after{ width:240px; height:240px; background:var(--blue); top:20px; right:8%; animation-delay:-4s; }
@keyframes heroFloat{
  0%,100%{ transform:translateY(0) scale(1); }
  50%{ transform:translateY(18px) scale(1.06); }
}
.hero h1{
  background:linear-gradient(135deg, var(--text), var(--amber) 130%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}

/* Admin nav — active glow */
.admin-nav button.active{ box-shadow:inset 0 0 0 1px var(--amber-soft); }

/* Score ring — pop-in entrance */
.score-ring{ animation:ringPop .5s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes ringPop{ from{ opacity:0; transform:scale(.7); } to{ opacity:1; transform:scale(1); } }
.score-ring .num{ animation:numFade .4s .22s ease both; }
@keyframes numFade{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }

/* Badges — subtle live pulse for "open" state */
.badge-open{ animation:badgePulse 2.2s ease-in-out infinite; }
@keyframes badgePulse{ 0%,100%{ box-shadow:0 0 0 0 var(--amber-soft); } 50%{ box-shadow:0 0 0 5px transparent; } }

/* ---- professional footer ---- */
.site-footer{ margin-top:40px; position:relative; z-index:16; background:var(--panel); border-top:1px solid var(--line); }
.site-footer::before{
  content:''; position:absolute; top:-1px; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent, var(--amber) 20%, var(--blue) 55%, transparent 90%);
  opacity:.6;
}
.footer-inner{ display:flex; justify-content:space-between; gap:24px; flex-wrap:wrap; padding:28px 20px 20px; }
.footer-brand-row{ display:flex; align-items:center; gap:9px; font-weight:700; font-size:14.5px; margin-bottom:6px; }
.footer-brand-icon{ width:24px; height:24px; border-radius:7px; }
.footer-brand-icon .ic{ width:13px; height:13px; }
.footer-brand p{ margin:0; color:var(--muted); font-size:12.5px; max-width:320px; line-height:1.5; }
.footer-contact{ text-align:left; min-width:200px; }
.footer-heading{ display:block; font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--muted-2); margin-bottom:8px; }
.footer-contact-links{ display:flex; flex-direction:column; gap:6px; }
.footer-contact-links a{ display:inline-flex; align-items:center; gap:7px; color:var(--muted); text-decoration:none; font-size:13px; transition:.15s color; }
.footer-contact-links a .ic{ color:var(--amber); width:13px; height:13px; }
.footer-contact-links a:hover{ color:var(--text); }
.footer-muted{ color:var(--muted-2); font-size:12.5px; }
.footer-address{ display:flex; align-items:flex-start; gap:7px; color:var(--muted); font-size:12.5px; margin-top:8px; line-height:1.5; }
.footer-address .ic{ color:var(--amber); margin-top:1px; flex-shrink:0; width:13px; height:13px; }
.footer-bottom{ border-top:1px solid var(--line); padding:14px 20px; text-align:center; color:var(--muted-2); font-size:12px; }
@media (max-width:600px){ .footer-inner{ flex-direction:column; gap:18px; } }

/* ================= MOBILE OPTIMISATION ================= */
@media (max-width:600px){
  .wrap, .wrap-narrow{ padding:0 14px; }
  main{ padding:20px 0 40px; }

  /* topbar — keep name / ID / logout from crowding or overlapping the brand */
  .topbar-inner{ padding:10px 14px; gap:8px; }
  .brand{ font-size:14px; gap:8px; min-width:0; }
  .brand > div{ min-width:0; }
  .brand small{ font-size:9.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand-icon{ width:22px; height:22px; }
  .brand-icon .ic{ width:13px; height:13px; }
  .session-chip{ gap:6px; flex-shrink:0; }
  .session-chip .who{ max-width:112px; }
  .session-chip .who b{ font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .session-chip .who span{ font-size:9.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
  .session-chip .btn{ padding:7px 10px; font-size:12px; }

  /* hero */
  .hero{ padding:34px 0 8px; }
  .hero h1{ font-size:23px; line-height:1.28; }
  .hero p{ font-size:13px; }
  .hero::before{ width:180px; height:180px; }
  .hero::after{ width:150px; height:150px; }

  /* cards / panels */
  .card{ padding:16px; }
  .panel-head{ gap:10px; }
  .panel-head h2{ font-size:16.5px; }
  .panel-head p{ font-size:12px; }

  /* exam question cards — the main overlap risk area, given extra breathing room */
  .qcard{ padding:15px 14px 14px; }
  .qtext{ font-size:14.5px; line-height:1.5; }
  .qnum{ width:22px; height:22px; font-size:11px; margin-right:8px; }
  .opt{ padding:10px 11px; font-size:13px; gap:9px; }
  .opt .letter{ width:20px; height:20px; font-size:10.5px; }
  .exam-meta{ gap:8px; }
  .qlang-select button, .lang-toggle button{ padding:6px 10px; font-size:11px; }

  /* item rows / admin lists — labels and action buttons stack instead of overlapping */
  .item-row{ flex-wrap:wrap; padding:12px 13px; }
  .item-row .actions{ width:100%; justify-content:flex-end; }
  .q-edit-row{ padding:12px 13px; }
  .q-edit-row .qtop{ flex-wrap:wrap; }

  /* admin section nav */
  .admin-nav button{ font-size:12.5px; padding:9px 11px; gap:10px; }
  .admin-nav button .ic{ width:32px; height:32px; border-radius:9px; }

  /* results table — smaller but still fully legible, scrolls horizontally */
  table{ font-size:12.5px; }
  thead th{ padding:9px 11px; font-size:10.5px; }
  tbody td{ padding:9px 11px; }

  /* score ring */
  .score-ring{ width:118px; height:118px; }
  .score-ring .num{ font-size:27px; }

  /* footer */
  .footer-inner{ padding:22px 14px 16px; }
  .footer-brand p{ max-width:none; }
  .footer-bottom{ padding:12px 14px; font-size:11px; }
}
@media (max-width:360px){
  /* smallest phones only — drop the name/ID chip so nothing crowds the logout button */
  .session-chip .who{ display:none; }
  .brand small{ display:none; }
}
/* ================= BRANDING: logo, background posters, header clock ================= */
:root{ --scrim-rgb:10,15,28; }
html[data-theme="light"]{ --scrim-rgb:243,245,250; }
#app{ position:relative; z-index:1; }
#pageBg{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; display:none; }
html.has-page-bg #pageBg{ display:block; }
#pageBg[data-key="header"], .bg-layer[data-bg="header"], .bar-media[data-media="header"]{ --b:var(--bgb-header); --d:var(--bgd-header); }
#pageBg[data-key="footer"], .bg-layer[data-bg="footer"], .bar-media[data-media="footer"]{ --b:var(--bgb-footer); --d:var(--bgd-footer); }
#pageBg[data-key="login"],  .bg-layer[data-bg="login"],  .bar-media[data-media="login"]{  --b:var(--bgb-login);  --d:var(--bgd-login); }
#pageBg[data-key="site"],   .bg-layer[data-bg="site"],   .bar-media[data-media="site"]{   --b:var(--bgb-site);   --d:var(--bgd-site); }
.bg-layer{ position:absolute; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
.bar-media{ position:absolute; inset:0; overflow:hidden; }
#pageBg .bg-img, .bg-layer .bg-img, .bar-media .bg-img{
  position:absolute; inset:-28px; background-size:cover;
  background-position:center; background-repeat:no-repeat; filter:blur(var(--b,0px));
}
#pageBg video.bg-img, .bg-layer video.bg-img, .bar-media video.bg-img{
  width:calc(100% + 56px); height:calc(100% + 56px); object-fit:cover;
}
#pageBg .bg-dim, .bg-layer .bg-dim, .bar-media .bg-dim{ position:absolute; inset:0; background:rgba(var(--scrim-rgb), var(--d,.3)); }
.topbar.has-bg{ background:transparent; }
/* header / footer bar background lives in its own layer so its transparency can be adjusted from Site Settings */
:root{ --panel-rgb:18,26,46; }
html[data-theme="light"]{ --panel-rgb:255,255,255; }
.topbar{ background:transparent; backdrop-filter:var(--hdr-bf, blur(14px) saturate(140%)); -webkit-backdrop-filter:var(--hdr-bf, blur(14px) saturate(140%)); }
.site-footer{ background:transparent; }
.bar-bg{ position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.bar-bg[data-bar="header"]{ opacity:var(--hdr-op,.7); }
.bar-bg[data-bar="footer"]{ opacity:var(--ftr-op,1); }
.bar-tint{ position:absolute; inset:0; background:rgb(var(--panel-rgb)); }
.topbar-inner{ position:relative; z-index:1; }
.site-footer.has-bg{ background:transparent; }
/* over a poster, secondary text switches to full-strength text colour + soft shadow so it stays readable */
.topbar.has-bg, .site-footer.has-bg{ --muted:var(--text); --muted-2:var(--text); text-shadow:0 1px 6px rgba(var(--scrim-rgb),.65); }
html.has-page-bg .hero{ --muted:var(--text); text-shadow:0 1px 8px rgba(var(--scrim-rgb),.6); }
.site-footer .footer-inner, .site-footer .footer-bottom{ position:relative; z-index:1; }
/* with a full-screen image behind the page, let the boxes turn into soft glass so the poster shows around/through them */
html.has-page-bg .card, html.has-page-bg .tile, html.has-page-bg .role-card,
html.has-page-bg .stat-box, html.has-page-bg .admin-nav{
  background:var(--glass); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
html.has-page-bg .hero::before, html.has-page-bg .hero::after{ display:none; }

/* custom round logo (replaces the default shield icon everywhere) */
.brand-icon.brand-logo{
  width:34px; height:34px; border-radius:50%; background-color:transparent;
  background-image:var(--logo-img,none); background-size:cover; background-position:center; background-repeat:no-repeat;
  box-shadow:0 0 0 2px var(--amber-soft);
}
.footer-brand-icon.brand-logo{ width:28px; height:28px; border-radius:50%; }
@media (max-width:600px){ .brand-icon.brand-logo{ width:28px; height:28px; } .footer-brand-icon.brand-logo{ width:26px; height:26px; } }

/* header date & time */
.hdr-clock{ display:flex; flex-direction:column; align-items:center; line-height:1.25; text-align:center; flex-shrink:0; padding:0 12px; user-select:none; -webkit-user-select:none; }
.hc-date{ font-size:11.5px; color:var(--muted); font-weight:600; }
.hc-time{ font-size:15px; font-weight:700; font-family:var(--font-mono); letter-spacing:.3px; }
@media (max-width:600px){ .hc-wd, .hc-yr{ display:none; } .hc-date{ font-size:10.5px; } .hc-time{ font-size:13px; } .hdr-clock{ padding:0 6px; } }

/* admin: logo + background settings */
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.logo-setting{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.bg-item{ display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; padding:16px 0; }
.bg-item + .bg-item{ border-top:1px solid var(--line); }
.bg-item:first-child{ padding-top:0; }
.bg-thumb{
  position:relative; width:200px; height:84px; flex-shrink:0; overflow:hidden; border-radius:var(--radius-sm);
  border:1px solid var(--line-2); background:var(--panel-2); display:flex; align-items:center; justify-content:center;
  color:var(--muted-2); font-size:12px;
}
.bg-body{ flex:1; min-width:240px; }
.bg-body b{ display:block; font-size:14px; }
.bg-body .hint{ font-size:12px; color:var(--muted-2); margin-top:3px; }
.bg-actions{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 8px; }
.range-row{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--muted); margin-top:6px; }
.range-row .rl{ width:36px; font-weight:600; }
.range-row input[type=range]{ width:200px; max-width:100%; accent-color:var(--amber); }
.range-row .rv{ width:46px; font-family:var(--font-mono); color:var(--text); }
.range-row input:disabled{ opacity:.4; }

/* ---- home / login screens: hero text + small login boxes on the left, rest of the picture left clear ---- */
.hero.hero-left{ text-align:left; padding:clamp(24px,9vh,92px) 0 24px; }
.hero-left .hero-copy{ max-width:440px; }
.hero-left h1{ font-size:clamp(28px,3.4vw,44px); line-height:1.12; margin:0 0 14px; }
/* gradient headline: a text-shadow would show through the transparent glyphs, so use a drop-shadow instead */
.hero h1{ text-shadow:none; }

/* =========================================================
   SECURITY EXAM PORTAL
   Storage: Supabase (shared cloud database).
   Session (who's logged in on this device) still uses
   localStorage — that's just this browser's login state.

const POSTS = ["SO","SS","SG","CO"];

/* =========================================================
   Supabase-backed storage.
   Local `DB` stays an in-memory cache with the exact same
   shape/field names the rest of the app already uses
   (camelCase) — only the load/save layer talks to Supabase.
   ========================================================= */
const SUPABASE_URL = 'https://btdqwrbrrijvnxgbpxdu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0ZHF3cmJycmlqdm54Z2JweGR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1MzUxMDIsImV4cCI6MjEwNTExMTEwMn0.HzIdzmtqBzRjaydgh0q6j2u7ro86PI92CIShngPUjjA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function toCamel(row){
  const out = {};
  for(const k in row){
    const ck = k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase());
    let v = row[k];
    /* timestamptz columns (registeredAt/createdAt/submittedAt) come back
       as ISO strings from Supabase — convert to epoch-ms numbers since the
       rest of the app sorts/formats these as numbers (Date.now()-style) */
    if(/At$/.test(ck) && typeof v === 'string'){ const t = new Date(v).getTime(); if(!isNaN(t)) v = t; }
    out[ck] = v;
  }
  return out;
}
function toSnake(obj){
  const out = {};
  for(const k in obj){
    let v = obj[k];
    /* reverse of the above: epoch-ms numbers -> ISO strings before sending
       to a timestamptz column, otherwise Postgres rejects the raw number */
    if(/At$/.test(k) && typeof v === 'number'){ v = new Date(v).toISOString(); }
    out[k.replace(/[A-Z]/g,c=>'_'+c.toLowerCase())] = v;
  }
  return out;
}
function guardRowToObj(row){ return toCamel(row); }
function guardObjToRow(o){ return toSnake(o); }
function adminRowToObj(row){ const o = toCamel(row); o.password = o.passwordHash; delete o.passwordHash; return o; }
function adminObjToRow(o){ const c = Object.assign({}, o); c.passwordHash = c.password; delete c.password; return toSnake(c); }

async function loadAllData(){
  /* admins table is intentionally NOT fetched here — its select/insert
     policies were revoked so nobody's admin credentials ever reach a
     browser; admin login goes through the verify_admin_login() RPC instead. */
  const [g,m,e,q,at] = await Promise.all([
    sb.from('guards_public').select('*'),
    sb.from('months').select('*'),
    sb.from('exams').select('*'),
    sb.from('questions').select('*'),
    sb.from('attempts').select('*'),
  ]);
  const firstErr = [g,m,e,q,at].find(r=>r.error);
  if(firstErr) throw firstErr.error;
  DB.guards = (g.data||[]).map(guardRowToObj);
  DB.months = (m.data||[]).map(toCamel);
  DB.exams = (e.data||[]).map(toCamel);
  DB.questions = (q.data||[]).map(toCamel);
  DB.attempts = (at.data||[]).map(toCamel);
}
async function withBusy(form, fn){
  const btn = form.querySelector('button[type="submit"]');
  const orig = btn ? btn.textContent : null;
  if(btn){ btn.disabled = true; btn.textContent = 'Please wait…'; }
  try{ await fn(); }
  catch(err){ console.error(err); alert('Something went wrong, please try again.\n' + (err&&err.message?err.message:err)); }
  finally{ if(btn){ btn.disabled = false; if(orig!=null) btn.textContent = orig; } }
}
/* ---- confirmation popup: shown after an admin action has actually been
   saved to the database, so the admin gets clear visual proof that what
   they clicked (add question, delete, lock, publish, etc.) has gone
   through. Auto-dismisses; can also be tapped/clicked to close early. */
let CONFIRM_TOAST_TIMER = null;
function showConfirmToast(message, kind){
  let host = document.getElementById('confirmToastHost');
  if(!host){
    host = document.createElement('div');
    host.id = 'confirmToastHost';
    host.setAttribute('aria-live','polite');
    document.body.appendChild(host);
  }
  host.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'confirm-toast' + (kind==='danger' ? ' confirm-toast-danger' : '');
  card.innerHTML = `
    <span class="confirm-toast-icon">
      <svg viewBox="0 0 52 52" width="22" height="22"><circle class="ct-circle" cx="26" cy="26" r="23" fill="none"/><path class="ct-check" fill="none" d="M14 27l7 7 17-17"/></svg>
    </span>
    <span class="confirm-toast-msg">${message}</span>
  `;
  card.addEventListener('click', ()=> dismissConfirmToast());
  host.appendChild(card);
  requestAnimationFrame(()=> card.classList.add('confirm-toast-show'));
  if(CONFIRM_TOAST_TIMER) clearTimeout(CONFIRM_TOAST_TIMER);
  CONFIRM_TOAST_TIMER = setTimeout(dismissConfirmToast, 2600);
}
function dismissConfirmToast(){
  const host = document.getElementById('confirmToastHost');
  if(!host) return;
  const card = host.querySelector('.confirm-toast');
  if(!card) return;
  card.classList.remove('confirm-toast-show');
  card.classList.add('confirm-toast-hide');
  setTimeout(()=>{ if(host) host.innerHTML=''; }, 220);
}
/* ---- write helper: confirms a Supabase write actually changed a row.
   With Row Level Security enabled, a write that a policy silently blocks
   comes back from Postgrest with NO error at all — just 0 rows affected.
   Every insert/update/delete in this app used to trust `error` alone, so a
   blocked write looked identical to a successful one: the UI updated
   optimistically and told the user it worked, but nothing was saved in
   Postgres — the change then quietly "undid itself" the next time the
   page (or another device) reloaded fresh data. Routing every write
   through here turns that silent failure into a visible, honest error. */
async function dbWrite(query, selectCols, tableLabel){
  try{
    const { data, error } = await query.select(selectCols||'*');
    if(error) return { ok:false, error };
    if(!data || data.length===0){
      const where = tableLabel ? ` on the "${tableLabel}" table` : ' on this table';
      return { ok:false, error:{ message:`The database did not apply this change (0 rows affected). This almost always means a Row Level Security (RLS) policy${where} is blocking the write — open the Supabase SQL editor and make sure a DELETE policy exists${where} for the anon role (see the SQL block your developer gave you).` } };
    }
    return { ok:true, data };
  }catch(error){
    return { ok:false, error };
  }
}

/* Reads an image the admin picked and shrinks it so it stays light for everyone who opens the site.
   circle:true  -> square centre-crop with round transparent edges (PNG) — used for the logo
   otherwise    -> scaled down to maxW x maxH, saved as JPEG — used for posters */
function fileToDataUrl(file, opt){
  return new Promise((resolve, reject)=>{
    if(opt && opt.video){
      if(!file || !/^video\//.test(file.type||'')){ reject(new Error('Please choose a video file (MP4 or WebM).')); return; }
      if(file.size > 15*1024*1024){ reject(new Error('This video is larger than 15 MB. Please trim it or compress it first — large videos are slow to load for guards on mobile data.')); return; }
      const vfr = new FileReader();
      vfr.onerror = ()=>reject(new Error('This file could not be read.'));
      vfr.onload = ()=>resolve(vfr.result);
      vfr.readAsDataURL(file);
      return;
    }
    if(!file || !/^image\//.test(file.type||'')){ reject(new Error('Please choose an image file (PNG, JPG or WebP).')); return; }
    const fr = new FileReader();
    fr.onerror = ()=>reject(new Error('This file could not be read.'));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('This image could not be opened. Please try a PNG or JPG.'));
      img.onload = ()=>{
        try{
          let sw = img.naturalWidth || 512, sh = img.naturalHeight || 512;
          const c = document.createElement('canvas'); const ctx = c.getContext('2d');
          ctx.imageSmoothingQuality = 'high';
          if(opt.circle){
            const side = Math.min(sw, sh), sx = (sw-side)/2, sy = (sh-side)/2, size = Math.min(opt.size, side);
            c.width = c.height = size;
            ctx.beginPath(); ctx.arc(size/2, size/2, size/2, 0, Math.PI*2); ctx.closePath(); ctx.clip();
            ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
            resolve(c.toDataURL('image/png'));
          } else {
            const r = Math.min(1, opt.maxW/sw, opt.maxH/sh);
            c.width = Math.max(1, Math.round(sw*r)); c.height = Math.max(1, Math.round(sh*r));
            ctx.fillStyle = '#0A0F1C'; ctx.fillRect(0,0,c.width,c.height);
            ctx.drawImage(img, 0, 0, c.width, c.height);
            resolve(c.toDataURL('image/jpeg', opt.quality||0.78));
          }
        }catch(e){ reject(e); }
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const STORAGE_BUCKET = 'site-media';
function canvasResizeToBlob(file, opt){
  return new Promise((resolve, reject)=>{
    if(!file || !/^image\//.test(file.type||'')){ reject(new Error('Please choose an image file (PNG, JPG or WebP).')); return; }
    const fr = new FileReader();
    fr.onerror = ()=>reject(new Error('This file could not be read.'));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('This image could not be opened. Please try a PNG or JPG.'));
      img.onload = ()=>{
        try{
          let sw = img.naturalWidth || 512, sh = img.naturalHeight || 512;
          const c = document.createElement('canvas'); const ctx = c.getContext('2d');
          ctx.imageSmoothingQuality = 'high';
          const r = Math.min(1, opt.maxW/sw, opt.maxH/sh);
          c.width = Math.max(1, Math.round(sw*r)); c.height = Math.max(1, Math.round(sh*r));
          ctx.fillStyle = '#0A0F1C'; ctx.fillRect(0,0,c.width,c.height);

async function uploadToStorage(fileOrBlob, keyHint, ext){
  const path = `${keyHint}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const { error: upErr } = await sb.storage.from(STORAGE_BUCKET).upload(path, fileOrBlob, {
    upsert: true, contentType: fileOrBlob.type || undefined, cacheControl: '31536000'
  });
  if(upErr){
    const raw = upErr.message || '';
    throw new Error(/bucket not found/i.test(raw)
      ? 'Storage isn\'t set up yet for this site. Please run the storage setup SQL (see "For your developer" below), then try again.'
      : (raw || 'Upload failed. Please try again.'));

  const { data: pub } = sb.storage.from(STORAGE_BUCKET).getPublicUrl(path);

  if(file.size > 20*1024*1024) throw new Error('This video is larger than 20 MB. Please trim it or compress it first — smaller clips load faster for guards on mobile data.');

/* ---- cleans up the file a background/hero image or video is REPLACING (or being reset away
   from), so old uploads don't keep silently piling up in Supabase Storage. Only ever deletes
   something that actually lives in our own bucket (never an unrelated external URL), and only
   once the new file has been saved successfully — so a failed upload never loses the old one. */
function storagePathFromUrl(url){
  if(!url) return null;
  const marker = `/storage/v1/object/public/${STORAGE_BUCKET}/`;
  const i = url.indexOf(marker);
  if(i===-1) return null;
  return decodeURIComponent(url.slice(i+marker.length).split('?')[0]);
}
async function deleteOldStorageFile(oldUrl, newUrl){
  if(!oldUrl || oldUrl===newUrl) return;
  const path = storagePathFromUrl(oldUrl);
  if(!path) return;
  try{ await sb.storage.from(STORAGE_BUCKET).remove([path]); }
  catch(err){ console.error('old media cleanup failed', err); } // cleanup is best-effort; never block the UI on it
}
const SITE_SETTINGS_LS_KEY = 'vses_site_settings';

/* ---- navigation history, driving the phone/browser's own physical back
   button/gesture only — there is no on-screen Back button anywhere in this
   app anymore. Every in-app navigation pushes one browser history entry
   (history.pushState); a single popstate listener below does the work of
   restoring the previous screen, confirming before an in-progress exam is
   discarded, and confirming + logging the person out when back is pressed
   with nothing left inside the app to go back to. ------------------------ */
let HISTORY = [];
function go(screen, extra){
  if(S && S.screen) HISTORY.push(S);
  S = Object.assign({screen}, extra||{});
  window.scrollTo({top:0,behavior:'instant'});
  try{ history.pushState({vsesNav:true}, ''); }catch(e){}
  render();
}
function patch(extra){ S = Object.assign({}, S, extra); render(); }
/* Switching between top-level sections (Master Data / Months & Exams /
   Results) is NOT a drill-down, so it must not stack up back-history like an
   undo/redo list. Each section is a fresh "root": HISTORY is cleared, any
   open sub-view (month detail, exam editor, guard profile, master-data box)
   is dropped, and the browser entry is replaced (not added). Pressing back
   on a section's home page therefore has nothing left to step back to and
   shows the logout confirmation, while drilling deeper from that section
   (goPush) still steps back one level at a time. */
function goRoot(extra){
  HISTORY = [];
  S = Object.assign({screen:'admin-dashboard'}, extra||{});
  window.scrollTo({top:0,behavior:'instant'});
  try{ history.replaceState({vsesNav:true}, ''); }catch(e){}
  render();
}
/* like go(), but stays on the same top-level screen while drilling into a
   sub-view (e.g. admin: months -> month detail -> question editor). Pushes
   the current state onto HISTORY so the physical/device back button steps back one
   sub-view at a time instead of jumping straight out to the login page. */
function goPush(extra){
  HISTORY.push(S);
  S = Object.assign({}, S, extra);
  window.scrollTo({top:0,behavior:'instant'});
  try{ history.pushState({vsesNav:true}, ''); }catch(e){}
  render();
}
/* Used right after a successful login/registration. Unlike go(), this does
   NOT push the login/auth screen onto HISTORY — the dashboard the person
   lands on becomes the app's fresh "root" screen, with nothing behind it.
   That way one back-button press from here means "there is nothing left
   inside the app", which is exactly when the exit-confirmation + auto
   logout in the popstate listener below should kick in — instead of
   quietly showing the login form again while the session is still active. */
function enterApp(screen, extra){
  HISTORY = [];
  S = Object.assign({screen}, extra||{});
  window.scrollTo({top:0,behavior:'instant'});
  try{ history.pushState({vsesNav:true}, ''); }catch(e){}
  render();
}
window.addEventListener('popstate', ()=>{
  if(S && S.screen==='guard-exam-run' && !S.submitted){
    // Never let a stray back-button press quietly throw away an in-progress
    // exam and its answers — confirm first, and if the person cancels,
    // push the browser back to where it was so they stay on the exam.
    const leave = confirm('Are you sure you want to leave? Your exam progress and answers will be lost.');
    if(!leave){ try{ history.pushState({vsesNav:true}, ''); }catch(e){} return; }
  }
  if(HISTORY.length===0 && SESSION){
    // Nothing left inside the app to step back to — this is the screen
    // reached right after login (select-month for a guard, the dashboard
    // for an admin). A native app asks before exiting instead of silently
    // dropping the session, so do the same here: confirm, and only on
    // "OK" log the person out and land on the login screen. On "Cancel",
    // push the browser forward again so they stay exactly where they were.
    const exit = confirm('Are you sure you want to exit? You will be logged out.');
    if(!exit){ try{ history.pushState({vsesNav:true}, ''); }catch(e){} return; }
    clearSession();
    enterApp('home');
    return;
  }
  if(S && S.adminTab==='exam') resetQB();
  if(HISTORY.length>0){
    S = HISTORY.pop();
    window.scrollTo({top:0,behavior:'instant'});
    render();
  }
  // if HISTORY is already empty (and no session is active) there is nothing
  // left inside the app to go back to, so the browser is simply allowed to
  // leave the page as it normally would — exactly like pressing back on any
  // other website.
});

function findGuard(mobile){ return DB.guards.find(g=>g.mobile===mobile); }
function findAdmin(mobile){ return DB.admins.find(a=>a.mobile===mobile); }
function monthsSorted(){
  return DB.months.slice().sort((a,b)=>{
    const ay = a.year!=null?a.year:9999, am = a.monthNum!=null?a.monthNum:0;
    const by = b.year!=null?b.year:9999, bm = b.monthNum!=null?b.monthNum:0;
    if(ay!==by) return ay-by;
    if(am!==bm) return am-bm;
    return a.createdAt-b.createdAt;
  });
}
function examsForMonth(monthId){ return DB.exams.filter(e=>e.monthId===monthId).sort((a,b)=>a.createdAt-b.createdAt); }
function questionsForExam(examId){ return DB.questions.filter(q=>q.examId===examId).sort((a,b)=>a.order-b.order); }
/* Security-person side must only ever see questions the admin has explicitly
   marked "Done" (published). Questions created before this feature existed
   have no `published` field stored — default those to visible so nothing
   that was already live to guards suddenly disappears. */
function isQPublished(q){ return q.published!==undefined ? !!q.published : true; }
function publishedQuestionsForExam(examId){ return questionsForExam(examId).filter(isQPublished); }
function attemptsFor(guardMobile, examId){ return DB.attempts.filter(a=>a.guardMobile===guardMobile && a.examId===examId).sort((a,b)=>b.submittedAt-a.submittedAt); }
function latestAttempt(guardMobile, examId){ const l = attemptsFor(guardMobile, examId); return l[0]||null; }
function allAttemptsForGuard(mobile){ return DB.attempts.filter(a=>a.guardMobile===mobile).sort((a,b)=>b.submittedAt-a.submittedAt); }
function examById(id){ return DB.exams.find(e=>e.id===id); }
function monthById(id){ return DB.months.find(m=>m.id===id); }
/* Ranks every registered guard by their all-time percentage across every exam
   they have attempted at least once (latest attempt per exam is used, so a
   retake doesn't get double-counted). Highest percentage first. */
function guardRanking(){
  return DB.guards.map(g=>{
    const atts = allAttemptsForGuard(g.mobile);
    const examIds = [...new Set(atts.map(a=>a.examId))];
    let totalMarks=0, achievedMarks=0;
    examIds.forEach(exId=>{
      const la = latestAttempt(g.mobile, exId);
      if(la){ totalMarks += la.total; achievedMarks += la.score; }
    });
    const pct = totalMarks>0 ? (achievedMarks/totalMarks*100) : 0;
    return { g, totalMarks, achievedMarks, pct, examsAttempted: examIds.length };
  }).sort((a,b)=> b.pct-a.pct || b.examsAttempted-a.examsAttempted);
}
/* For a given month record, which of its exams are "in scope" given the
   Exam-type filter — either all exams of the month, or just the one type. */
function masterDataExamsToCheck(){
  const monthsAll = monthsSorted();
  const selMonthRec = monthsAll.find(m=>m.monthNum===S.mdMonthNum && m.year===S.mdYear) || null;
  const examsInMonth = selMonthRec ? examsForMonth(selMonthRec.id) : [];
  const examsToCheck = S.mdExamType ? examsInMonth.filter(e=>e.examType===S.mdExamType) : examsInMonth;
  return { selMonthRec, examsInMonth, examsToCheck };
}
/* A guard counts as "Attend" only if they attempted every exam currently in
   scope (per masterDataExamsToCheck); missing even one puts them in "Not Attend". */
function masterDataAttendance(){
  const { examsToCheck } = masterDataExamsToCheck();
  const attend = [], notAttend = [];
  DB.guards.forEach(g=>{
    const attemptedAll = examsToCheck.length>0 && examsToCheck.every(ex=>DB.attempts.some(a=>a.guardMobile===g.mobile && a.examId===ex.id));
    (attemptedAll?attend:notAttend).push(g);
  });
  return { attend, notAttend };
}
/* For a "Not Attend" guard: which exam types (within the current month/year/
   exam-type scope) they have not attempted yet — e.g. "Post Psara, Human rights". */
/* Readable label for an exam everywhere the admin sees it. Some exams have an
   empty English name (only exam type / Hindi name set), which used to make
   chips and table cells render blank — so fall back type -> name -> Hindi. */
function examLabel(ex){
  if(!ex) return '-';
  const name = (ex.nameEn||'').trim() || (ex.nameHi||'').trim();
  if(ex.examType && name && name!==ex.examType) return ex.examType + ' — ' + name;
  return ex.examType || name || 'Exam';
}
function missedExamTypesFor(mobile, examsToCheck){
  const missed = examsToCheck.filter(ex=>!DB.attempts.some(a=>a.guardMobile===mobile && a.examId===ex.id));
  return [...new Set(missed.map(ex=>ex.examType || ex.nameEn || ex.nameHi || 'Exam'))];
}

/* ---- exam name headline (security-person side): controlled by admin's
   "Exam name (English)" / "Exam name (Hindi)" checkboxes. Older exams saved
   before this feature had no flags stored, so undefined defaults to true on
   both so their headline keeps showing exactly as it did before. ---- */
function examShowFlags(ex){
  return {
    en: ex.showNameEn!==undefined ? !!ex.showNameEn : true,
    hi: ex.showNameHi!==undefined ? !!ex.showNameHi : true
  };
}
function examHeadlinePlain(ex){
  const f = examShowFlags(ex);
  if(f.en && f.hi) return ex.nameEn + ' / ' + ex.nameHi;
  if(f.en) return ex.nameEn;
  if(f.hi) return ex.nameHi;
  return ex.nameEn;
}
function examHeadlineHtml(ex){
  const f = examShowFlags(ex);
  if(f.en && f.hi) return `${esc(ex.nameEn)} <span style="color:var(--muted);font-weight:500;">/ ${esc(ex.nameHi)}</span>`;
  if(f.en) return esc(ex.nameEn);
  if(f.hi) return esc(ex.nameHi);

}

}

/* ============ EXAM SECURITY (no-copy / screenshot deterrent) ============
   Note: browsers cannot truly block OS-level screenshots/screen recording —
   this is a best-effort deterrent (disables selection/copy/right-click,
   blocks common save/print/devtools shortcuts, and blurs the screen when the
   tab/window loses focus, which catches most snipping-tool / screen-record
   attempts since they take focus away from the browser). */
(function setupExamSecurity(){
  const isSecure = ()=> document.body.classList.contains('secure-mode');
  document.addEventListener('contextmenu', e=>{ if(isSecure()) e.preventDefault(); });
  document.addEventListener('selectstart', e=>{ if(isSecure()) e.preventDefault(); });
  document.addEventListener('dragstart', e=>{ if(isSecure()) e.preventDefault(); });
  ['copy','cut','paste'].forEach(evt=>{
    document.addEventListener(evt, e=>{ if(isSecure()) e.preventDefault(); });
  });
  document.addEventListener('keydown', e=>{
    if(!isSecure()) return;
    const k = e.key;
    const blockedCombo =
      ((e.ctrlKey||e.metaKey) && ['c','x','u','s','p'].includes((k||'').toLowerCase())) ||
      ((e.ctrlKey||e.metaKey) && e.shiftKey && ['i','j','c'].includes((k||'').toLowerCase())) ||
      k==='PrintScreen' || k==='F12';
    if(blockedCombo) e.preventDefault();
  });
  window.addEventListener('blur', ()=>{ if(isSecure()) document.body.classList.add('secure-blurred'); });
  document.addEventListener('visibilitychange', ()=>{
    if(isSecure() && document.hidden) document.body.classList.add('secure-blurred');
  });
  window.addEventListener('focus', ()=>{ document.body.classList.remove('secure-blurred'); });
})();

let LAST_HOME_CLICK = 0;
let WINDOW_RESIZE_BOUND = false;
/* Matches the sidebar's CSS transition duration (.55s) — the actual tab
   switch is deferred until the close animation has visibly finished. */
const SIDEBAR_ANIM_MS = 560;
function bindGlobal(){
  document.querySelectorAll('[data-act="home"]').forEach(el=>{
    /* double-click used to fire the click handler twice in a row (and could
       highlight the brand text) — this makes a rapid double-click a no-op:
       the first click still navigates home, the second within 500ms (and any
       native dblclick text-selection) is swallowed. */
    el.addEventListener('dblclick', e=>{ e.preventDefault(); e.stopPropagation(); });
    el.addEventListener('click', e=>{
      const now = Date.now();
      if(now - LAST_HOME_CLICK < 500){ e.preventDefault(); return; }
      LAST_HOME_CLICK = now;
      HISTORY=[]; go('home');
    });
  });
  document.querySelectorAll('[data-act="logout"]').forEach(el=>el.addEventListener('click',()=>{ clearSession(); enterApp('home'); }));
  document.querySelectorAll('[data-navtoggle]').forEach(el=>{
    const toggle = ()=> setAdminSidebarOpen(!S.adminNavOpen);
    el.addEventListener('click', toggle);
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } });
  });
  document.querySelectorAll('.admin-sidebar [data-navto]').forEach(el=>el.addEventListener('click',()=>{
    const id = el.getAttribute('data-navto');
    setAdminSidebarOpen(false); // slides shut + the section expands back to full width
    setTimeout(()=>{ resetQB(); goRoot({adminTab:id, adminNavOpen:false}); }, SIDEBAR_ANIM_MS);
  }));
  syncHeaderHeightVar();
  syncSidebarWidthVar();
  if(!WINDOW_RESIZE_BOUND){
    WINDOW_RESIZE_BOUND = true;
    window.addEventListener('resize', ()=>{ syncHeaderHeightVar(); syncSidebarWidthVar(); });
  }
}
/* Toggles the sidebar/section-shrink directly on the existing DOM nodes
   (rather than via patch->render) so the slide/shrink transition is
   actually visible — a full re-render would recreate the elements
   already in their final state and skip the animation entirely. */
function setAdminSidebarOpen(open){
  S.adminNavOpen = open;
  const sidebar = document.querySelector('.admin-sidebar');
  if(sidebar) sidebar.classList.toggle('open', open);
  document.body.classList.toggle('admin-sidebar-open', open);
}
/* keeps the sidebar/backdrop's top offset (--hdr-h) matched to the
   topbar's real rendered height, which varies across breakpoints. */
function syncHeaderHeightVar(){
  const tb = document.querySelector('.topbar');
  if(tb) document.documentElement.style.setProperty('--hdr-h', tb.offsetHeight+'px');
}
/* keeps the section's shrink amount (--sidebar-w) matched to the
   sidebar's real rendered width, since it's capped at 84vw on narrow
   screens and won't always be the full 272px. */
function syncSidebarWidthVar(){
  const sb = document.querySelector('.admin-sidebar');
  if(sb) document.documentElement.style.setProperty('--sidebar-w', sb.offsetWidth+'px');
}

    </div>

}
/* a new box's starting spot: opposite side of the hero text (centre alignment alternates sides) */
function newHeroBox(list, kind){
  kind = kind==='text' ? 'text' : 'media';
  const align = (SITE_SETTINGS.heroAlign==='center' || SITE_SETTINGS.heroAlign==='right') ? SITE_SETTINGS.heroAlign : 'left';
  let side;
  if(align==='left') side = 'right';
  else if(align==='right') side = 'left';
  else{ // centred text: alternate, keeping left/right balanced rather than just counting total boxes
    const rightCount = list.filter(b=>b.x>=50).length, leftCount = list.length - rightCount;
    side = rightCount <= leftCount ? 'right' : 'left';
  }
  // centred text sits in the middle of the page, so boxes for that layout sit narrower and further
  // out toward the edges to clear it; left/right layouts can use the wider default.
  const pos = align==='center'
    ? (side==='right' ? {x:70, w:28} : {x:2, w:28})
    : (side==='right' ? {x:55, w:41} : {x:4, w:41});
  const onSide = list.filter(b => (side==='right' ? b.x>=50 : b.x<50)).length;
  const id = 'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const y = Math.min(6+onSide*5, 24);
  if(kind==='text') return { id, kind:'text', x:pos.x, y, w:pos.w, h:16, r:0, text:'', fontFamily:'', fontSize:26, color:'#eaeff9', align:'left' };
  return {
    id, kind:'media', x:pos.x, y, w:pos.w, h:66, r:20, type:'image', url:''
  };
}

function autoNameCase(str){
  return str.replace(/\S+/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
}
function bindGuardAuth(){
  document.querySelectorAll('.tab').forEach(el=>el.addEventListener('click',()=>patch({authTab: el.getAttribute('data-tab'), formError:null})));
  document.querySelectorAll('[data-pwtoggle]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const inp = btn.previousElementSibling;
      const showing = inp.type==='text';
      inp.type = showing?'password':'text';
      btn.innerHTML = icon(showing?'eye':'eyeOff',17);
    });
  });
  const nameInp = document.getElementById('regNameInput');
  if(nameInp) nameInp.addEventListener('input',()=>{
    const pos = nameInp.selectionStart;
    const before = nameInp.value;
    nameInp.value = autoNameCase(before);
    if(pos!=null) nameInp.setSelectionRange(pos,pos);
  });
  const lf = document.getElementById('loginForm');
  if(lf) lf.addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(lf);
    const mobile = fd.get('mobile').trim();
    const pin = fd.get('pin');
    if(!/^\d{4}$/.test(pin)){ patch({formError:'PIN must be 4 digits.'}); return; }
    withBusy(lf, async ()=>{
      const {data, error} = await sb.rpc('verify_guard_login', {p_mobile: mobile, p_pin: pin});
      if(error) throw error;
      if(!data || data.length===0){ patch({formError:'Incorrect mobile number or PIN.'}); return; }
      const row = data[0];
      const guard = { mobile: row.mobile, name: row.name, gatePass: row.gate_pass, post: row.post, seenExams: row.seen_exams||[] };
      const existing = findGuard(mobile);
      if(existing) Object.assign(existing, guard); else DB.guards.push(guard);
      setSession({role:'guard', mobile, name: guard.name, gatePass: guard.gatePass, post: guard.post});
      enterApp('guard-dashboard');
    });
  });
  const rf = document.getElementById('regForm');
  if(rf) rf.addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(rf);
    const mobile = fd.get('mobile').trim();
    const gatePass = fd.get('gatePass').trim();
    const pin = fd.get('pin');
    const pin2 = fd.get('pin2');
    if(!/^\d{10}$/.test(mobile)){ patch({formError:'Enter a valid 10-digit mobile number.'}); return; }
    if(!/^\d{4}$/.test(pin)){ patch({formError:'PIN must be 4 digits.'}); return; }
    if(pin!==pin2){ patch({formError:'The two PINs do not match.'}); return; }
    withBusy(rf, async ()=>{
      const {data, error} = await sb.rpc('register_guard', {
        p_mobile: mobile, p_name: fd.get('name').trim(), p_gate_pass: gatePass, p_post: fd.get('post'), p_pin: pin
      });
      if(error){
        if(String(error.message||'').includes('MOBILE_EXISTS')){ patch({formError:'This mobile number is already registered. Please log in.', authTab:'login'}); return; }
        if(String(error.message||'').includes('GATEPASS_EXISTS')){ patch({formError:'This gate pass number is already registered.'}); return; }
        throw error;
      }
      const row = data[0];
      const guard = { mobile: row.mobile, name: row.name, gatePass: row.gate_pass, post: row.post, seenExams: [] };
      DB.guards.push(guard);
      setSession({role:'guard', mobile, name: guard.name, gatePass: guard.gatePass, post: guard.post});
      enterApp('guard-dashboard');
    });
  });
}

function bindResult(){
  document.querySelector('[data-act2="back"]').addEventListener('click',()=>go('guard-month',{monthId:S.monthId}));
  document.querySelector('[data-act2="review"]').addEventListener('click',()=>go('guard-review',{attemptId:S.attemptId, from:'guard-month', monthId:S.monthId}));
  const numEl = document.querySelector('.score-ring .num');
  if(numEl){
    const target = parseInt(numEl.textContent,10) || 0;
    if(target>0){
      const dur = 700, start = performance.now();
      const step = now=>{
        const p = Math.min(1,(now-start)/dur);
        numEl.textContent = Math.round(target * (1-Math.pow(1-p,3)));
        if(p<1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }
  }
}

function screenReview(mode){
  const att = DB.attempts.find(a=>a.id===S.attemptId);
  if(!att) return emptyState('warn','Attempt not found','');
  const ex = examById(att.examId);
  const qs = questionsForExam(ex.id);
  const g = findGuard(att.guardMobile);
  const dt = fmtDateTime(att.submittedAt);
  const lang = S.reviewLang || att.lang || 'en';
  const showToggle = !ex.qLang || ex.qLang==='both';
  const headline = mode==='admin'
    ? `${esc(ex.nameEn)} <span style="color:var(--muted);font-weight:500;">/ ${esc(ex.nameHi)}</span>`
    : examHeadlineHtml(ex);
  return `
  <div class="exam-read">
  <div class="panel-head">
    <div>
      <h2>${headline}${ex.examType?` <span class="chip">${esc(ex.examType)}</span>`:''}</h2>
      <p>${mode==='admin'?`<b style="color:var(--text)">${esc(g?g.name:att.guardMobile)}</b> · ${esc(g?g.gatePass:'')} · ${esc(g?g.post:'')} · `:''}${dt.date} ${dt.time} · Score ${att.score}/${att.total}</p>
    </div>
    ${showToggle?`<div class="lang-toggle">
      <button class="${lang==='en'?'active':''}" data-rlang="en">EN</button>
      <button class="${lang==='hi'?'active':''}" data-rlang="hi">हिं</button>
    </div>`:''}
  </div>
  ${qs.map((q,i)=>{
    const isImg = q.optType==='image';
    const sel = att.answers[i];
    return `<div class="qcard">
      <div class="qtext"><span class="qnum">${i+1}</span><span lang-hi>${esc(lang==='hi'?q.textHi:q.textEn)}</span></div>
      <div class="opt-list ${isImg?'opt-images':''}">
        ${q.options.map((opt,oi)=>{
          let cls='';
          if(mode==='admin'){
            if(oi===q.correct) cls='correct';
            else if(oi===sel && sel!==q.correct) cls='wrong';
          } else {
            /* Security person: only their own selected option should show green/red. If the wrong option is selected, the correct answer should not be shown. */
            if(oi===sel) cls = (sel===q.correct) ? 'correct' : 'wrong';
          }
          return `<div class="opt ${cls}">
            <span class="letter">${letter(oi)}</span>
            ${isImg?`<img src="${opt.img}" alt="">`:`<span lang-hi>${esc(lang==='hi'?opt.hi:opt.en)}</span>`}
            ${oi===sel?'<span style="margin-left:auto;font-size:11px;color:var(--muted);">your answer</span>':''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('')}
  </div>
  `;
}

}

/* Saves a partial settings patch immediately (used by the theme + footer
   toggles, which should apply the moment they're clicked). */
function saveSiteSettingPartial(partial, successMsg, opts){
  opts = opts || {};
  Object.assign(SITE_SETTINGS, partial);
  let lsOk = true;
  try{ localStorage.setItem(SITE_SETTINGS_LS_KEY, JSON.stringify(SITE_SETTINGS)); }catch(err){ lsOk = false; }
  if(opts.rerender===false) applyBranding(); else patch({});
  const onFail = (err)=>{ console.error(err); showConfirmToast(lsOk ? 'Saved on this device' : 'Applied for now, but could not be saved (device storage full)'); };
  const dbPartial = Object.assign({}, partial);
  if(dbPartial.heroBoxes) dbPartial.heroBoxes = JSON.stringify(dbPartial.heroBoxes); // hero_boxes is a text column
  sb.from('settings').upsert(toSnake(Object.assign({id:'site'}, dbPartial))).select('*').then(({error})=>{
    if(error) onFail(error); else showConfirmToast(successMsg);
  }).catch(onFail);
}

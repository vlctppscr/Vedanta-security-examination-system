let _boxFileInput = null, _boxFileTarget = null, _boxFileKind = null;
function pickBoxMedia(id, kind){
  if(!_boxFileInput){
    _boxFileInput = document.createElement('input');
    _boxFileInput.type = 'file'; _boxFileInput.style.display = 'none';
    document.body.appendChild(_boxFileInput);
    _boxFileInput.addEventListener('change', async ()=>{
      const file = _boxFileInput.files && _boxFileInput.files[0];
      const target = _boxFileTarget, kind = _boxFileKind;
      _boxFileInput.value = '';
      if(!file || !target) return;
      showConfirmToast(kind==='video' ? 'Uploading video…' : 'Uploading image…');
      try{
        const url = kind==='video'
          ? await uploadVideoToStorage(file, 'hero-box')
          : await uploadImageToStorage(file, 'hero-box', {maxW:1200, maxH:1200, quality:0.8});
        const list = (Array.isArray(SITE_SETTINGS.heroBoxes) ? SITE_SETTINGS.heroBoxes : []).slice();
        const b = list.find(x=>x.id===target);
        if(b){ b.url = url; b.type = kind; }
        saveSiteSettingPartial({heroBoxes:list}, kind==='video' ? 'Video added to box' : 'Image added to box', {rerender:false});
        refreshHeroPreview();
      }catch(err){ alert(err && err.message ? err.message : 'This file could not be used.'); }
    });
  }
  _boxFileTarget = id; _boxFileKind = kind;
  _boxFileInput.accept = kind==='video' ? 'video/*' : 'image/*';
  _boxFileInput.click();
}
function bindHeroBoxes(){
  const layer = document.querySelector('#heroPreviewInner .hero-boxes');
  const stage = document.querySelector('#heroPreviewInner .hero');
  if(!layer || !stage) return;
  const list = ()=> Array.isArray(SITE_SETTINGS.heroBoxes) ? SITE_SETTINGS.heroBoxes : [];
  const findBox = id => list().find(b=>b.id===id);
  const persist = ()=> saveSiteSettingPartial({heroBoxes:list().slice()}, 'Box updated', {rerender:false});

  layer.querySelectorAll('[data-box-drag]').forEach(handle=>{
    handle.addEventListener('pointerdown', e=>{
      if(e.target.closest('.hbtn') || e.target.tagName==='INPUT') return; // let toolbar buttons/slider work normally
      const id = handle.getAttribute('data-box-drag'), b = findBox(id); if(!b) return;
      const el = layer.querySelector(`.hbox-edit[data-box="${id}"]`);
      const rect = stage.getBoundingClientRect();
      const startX = e.clientX, startY = e.clientY, ox = b.x, oy = b.y;
      handle.setPointerCapture && handle.setPointerCapture(e.pointerId);
      e.preventDefault();
      const move = ev=>{
        const dx = ((ev.clientX-startX)/rect.width)*100, dy = ((ev.clientY-startY)/rect.height)*100;
        b.x = Math.max(0, Math.min(100-b.w, ox+dx));
        b.y = Math.max(0, Math.min(100-b.h, oy+dy));
        el.style.left = b.x+'%'; el.style.top = b.y+'%';
      };
      const up = ()=>{ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); persist(); };
      document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
    });
  });

  layer.querySelectorAll('[data-box-resize]').forEach(handle=>{
    handle.addEventListener('pointerdown', e=>{
      e.preventDefault(); e.stopPropagation();
      const id = handle.getAttribute('data-box-resize'), b = findBox(id); if(!b) return;
      const el = layer.querySelector(`.hbox-edit[data-box="${id}"]`);
      const rect = stage.getBoundingClientRect();
      const startX = e.clientX, startY = e.clientY, ow = b.w, oh = b.h;
      handle.setPointerCapture && handle.setPointerCapture(e.pointerId);
      const move = ev=>{
        const dw = ((ev.clientX-startX)/rect.width)*100, dh = ((ev.clientY-startY)/rect.height)*100;
        b.w = Math.max(12, Math.min(100-b.x, ow+dw));
        b.h = Math.max(12, Math.min(100-b.y, oh+dh));
        el.style.width = b.w+'%'; el.style.height = b.h+'%';
      };
      const up = ()=>{ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); persist(); };
      document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
    });
  });

  layer.querySelectorAll('[data-box-radius]').forEach(r=>{
    r.addEventListener('pointerdown', e=>e.stopPropagation());
    r.addEventListener('input', ()=>{
      const id = r.getAttribute('data-box-radius'), b = findBox(id); if(!b) return;
      b.r = parseInt(r.value,10);
      const el = layer.querySelector(`.hbox-edit[data-box="${id}"]`);
      if(el) el.style.borderRadius = b.r+'px';
    });
    r.addEventListener('change', persist);
  });

  layer.querySelectorAll('[data-box-del]').forEach(btn=>{
    btn.addEventListener('pointerdown', e=>e.stopPropagation());
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-box-del');
      const kept = list().filter(b=>b.id!==id);
      saveSiteSettingPartial({heroBoxes:kept}, 'Box removed', {rerender:false});
      refreshHeroPreview();
    });
  });

  layer.querySelectorAll('[data-box-img]').forEach(btn=>{
    btn.addEventListener('pointerdown', e=>e.stopPropagation());
    btn.addEventListener('click', ()=> pickBoxMedia(btn.getAttribute('data-box-img'), 'image'));
  });
  layer.querySelectorAll('[data-box-vid]').forEach(btn=>{
    btn.addEventListener('pointerdown', e=>e.stopPropagation());
    btn.addEventListener('click', ()=> pickBoxMedia(btn.getAttribute('data-box-vid'), 'video'));
  });

  // ---- text-block controls: type straight on the canvas, adjust size/colour/font in the strip ----
  layer.querySelectorAll('[data-box-text]').forEach(el=>{
    const id = el.getAttribute('data-box-text');
    el.addEventListener('pointerdown', e=>e.stopPropagation());
    el.addEventListener('input', ()=>{
      const b = findBox(id); if(!b) return;
      b.text = el.innerText;
    });
    el.addEventListener('blur', persist);
  });
  layer.querySelectorAll('[data-box-fontsize]').forEach(r=>{
    r.addEventListener('pointerdown', e=>e.stopPropagation());
    r.addEventListener('input', ()=>{
      const id = r.getAttribute('data-box-fontsize'), b = findBox(id); if(!b) return;
      b.fontSize = parseInt(r.value,10);
      const inner = layer.querySelector(`[data-box-text="${id}"]`);
      if(inner) inner.style.fontSize = b.fontSize+'px';
    });
    r.addEventListener('change', persist);
  });
  layer.querySelectorAll('[data-box-color]').forEach(inp=>{
    inp.addEventListener('pointerdown', e=>e.stopPropagation());
    inp.addEventListener('input', ()=>{
      const id = inp.getAttribute('data-box-color'), b = findBox(id); if(!b) return;
      b.color = inp.value;
      const inner = layer.querySelector(`[data-box-text="${id}"]`);
      if(inner) inner.style.color = b.color;
    });
    inp.addEventListener('change', persist);
  });
  layer.querySelectorAll('[data-box-font]').forEach(sel=>{
    sel.addEventListener('pointerdown', e=>e.stopPropagation());
    sel.addEventListener('change', ()=>{
      const id = sel.getAttribute('data-box-font'), b = findBox(id); if(!b) return;
      b.fontFamily = sel.value;
      ensureFont(b.fontFamily);
      const inner = layer.querySelector(`[data-box-text="${id}"]`);
      if(inner) inner.style.fontFamily = b.fontFamily ? fontStack(b.fontFamily) : '';
      persist();
    });
  });
}

function bindBrandingSettings(){

  document.querySelectorAll('[data-pick-vid]').forEach(btn=>btn.addEventListener('click', ()=>{

  document.querySelectorAll('input[data-file-img]').forEach(inp=>inp.addEventListener('change', async ()=>{

    try{
      const url = await uploadImageToStorage(file, 'bg-'+key, {maxW:1600, maxH:1600, quality:0.8});
      saveSiteSettingPartial({['bg'+capKey(key)]:url, ['bg'+capKey(key)+'Type']:'image'}, 'Image applied');
      deleteOldStorageFile(oldUrl, url); // old image/video for this slot is no longer used anywhere — remove it from storage
    }catch(err){ alert(err && err.message ? err.message : 'This image could not be used.'); }
  }));
  document.querySelectorAll('input[data-file-vid]').forEach(inp=>inp.addEventListener('change', async ()=>{
    const key = inp.getAttribute('data-file-vid');
    const file = inp.files && inp.files[0];
    inp.value = '';
    if(!file) return;
    const oldUrl = bgCfg(key).url;
    showConfirmToast('Uploading video…');
    try{
      const url = await uploadVideoToStorage(file, 'bg-'+key);
      saveSiteSettingPartial({['bg'+capKey(key)]:url, ['bg'+capKey(key)+'Type']:'video'}, 'Video applied');
      deleteOldStorageFile(oldUrl, url); // the video being replaced is gone from view everywhere — remove it from storage too
    }catch(err){ alert(err && err.message ? err.message : 'This video could not be used.'); }
  }));
  document.querySelectorAll('[data-reset]').forEach(btn=>btn.addEventListener('click', ()=>{

    const oldUrl = bgCfg(key).url, P = capKey(key);
    saveSiteSettingPartial({['bg'+P]:'', ['bg'+P+'Type']:'image', ['bg'+P+'Blur']:m.blur, ['bg'+P+'Dim']:m.dim}, 'Default look restored');
    deleteOldStorageFile(oldUrl, ''); // default has no file of its own — drop whatever was uploaded here
  }));
  /* sliders: preview live while dragging, save when released */
  document.querySelectorAll('input[data-range]').forEach(r=>{
    const key = r.getAttribute('data-range'), kind = r.getAttribute('data-kind'), prop = 'bg'+capKey(key)+kind;

  document.querySelectorAll('input[data-bar]').forEach(r=>{

  });
  document.querySelectorAll('[data-bar-reset]').forEach(btn=>btn.addEventListener('click', ()=>{
    const key = btn.getAttribute('data-bar-reset'), b = BAR_META.find(x=>x.key===key);

  }));
  const resetAll = document.getElementById('resetBrandingBtn');
  if(resetAll) resetAll.addEventListener('click', ()=>{
    if(!confirm('Remove the custom logo and all background images and go back to the default look?')) return;

    saveSiteSettingPartial(all, 'Default look restored');
  });

  const defYear = S.newYearSel!=null ? S.newYearSel : now.getFullYear();

  for(let y=now.getFullYear()-1; y<=now.getFullYear()+2; y++) yearOptions.push(y);

function bindAdminMonths(){
  const f = document.getElementById('addMonthForm');
  const ms = document.getElementById('monthNumSel');
  if(ms) ms.addEventListener('change',()=>{ S.newMonthSel = parseInt(ms.value,10); });
  const ys = document.getElementById('yearNumSel');
  if(ys) ys.addEventListener('change',()=>{ S.newYearSel = parseInt(ys.value,10); });
  if(f) f.addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(f);
    const monthNum = parseInt(fd.get('monthNum'),10);
    const yearNum = parseInt(fd.get('yearNum'),10);
    if(DB.months.some(m=>m.monthNum===monthNum && m.year===yearNum)){ alert('This month has already been added.'); return; }
    const label = MONTH_NAMES[monthNum] + ' ' + yearNum;
    const month = {id:uid('mo'), label, monthNum, year:yearNum, createdAt:Date.now(), locked:false};
    withBusy(f, async ()=>{
      const {ok,error} = await dbWrite(sb.from('months').insert(toSnake(month)));
      if(!ok) throw error;
      DB.months.push(month);
      S.newMonthSel = null; S.newYearSel = null;
      patch({});
      showConfirmToast('Month added');
    });
  });
  document.querySelectorAll('[data-lockmonth]').forEach(el=>el.addEventListener('click',()=>{
    const id = el.getAttribute('data-lockmonth');
    const m = monthById(id);
    if(!m) return;
    const newVal = !m.locked;
    el.disabled = true;
    dbWrite(sb.from('months').update({locked:newVal}).eq('id', id)).then(({ok,error})=>{
      if(!ok){ console.error(error); alert('Could not update the lock status.\n\n'+(error&&error.message?error.message:'Please try again.')); el.disabled=false; return; }
      m.locked = newVal;
      patch({});
      showConfirmToast(newVal ? 'Month locked' : 'Month unlocked');
    });
  }));
  document.querySelectorAll('[data-openmonth]').forEach(el=>el.addEventListener('click',()=>goPush({adminMonthId:el.getAttribute('data-openmonth')})));
  document.querySelectorAll('[data-delmonth]').forEach(el=>el.addEventListener('click',()=>{
    if(!confirm('Delete this entire month? All its exam sections, questions and attempts will also be deleted.')) return;
    const id = el.getAttribute('data-delmonth');
    el.disabled = true; el.textContent = 'Deleting…';
    dbWrite(sb.from('months').delete().eq('id', id)).then(({ok,error})=>{
      if(!ok){ console.error(error); alert('Delete failed.\n\n'+(error&&error.message?error.message:'Please try again.')); el.disabled=false; el.textContent='Delete'; return; }
      // cascade delete on the DB side already removed exams/questions/attempts under this month
      const examIds = DB.exams.filter(e=>e.monthId===id).map(e=>e.id);
      DB.exams = DB.exams.filter(e=>e.monthId!==id);
      DB.questions = DB.questions.filter(q=>!examIds.includes(q.examId));
      DB.attempts = DB.attempts.filter(a=>!examIds.includes(a.examId));
      DB.months = DB.months.filter(m=>m.id!==id);
      patch({});
      showConfirmToast('Month deleted', 'danger');
    });
  }));
}

function bindAdminExamQuestions(){
  const ex = examById(S.adminExamId);
  document.querySelectorAll('[data-qlang]').forEach(el=>el.addEventListener('click',()=>{
    const val = el.getAttribute('data-qlang');
    if(ex && ex.qLang!==val){
      const prev = ex.qLang;
      ex.qLang = val; resetQB(); patch({});
      dbWrite(sb.from('exams').update({q_lang:val}).eq('id', ex.id)).then(({ok,error})=>{ if(!ok){ console.error(error); ex.qLang = prev; alert('Could not change the question language.\n\n'+(error&&error.message?error.message:'')); patch({}); } });
    }
  }));
  document.querySelectorAll('[data-delq]').forEach(el=>el.addEventListener('click',()=>{
    if(!confirm('Delete this question?')) return;
    const delId = el.getAttribute('data-delq');
    el.disabled = true; el.textContent = 'Deleting…';
    dbWrite(sb.from('questions').delete().eq('id', delId)).then(({ok,error})=>{
      if(!ok){ console.error(error); alert('Delete failed.\n\n'+(error&&error.message?error.message:'Please try again.')); el.disabled=false; el.textContent='Delete'; return; }
      if(QB_STATE.editId===delId) resetQB();
      DB.questions = DB.questions.filter(q=>q.id!==delId);
      patch({});
      showConfirmToast('Question deleted', 'danger');
    });
  }));
  document.querySelectorAll('[data-editq]').forEach(el=>el.addEventListener('click',()=>{
    const q = DB.questions.find(qq=>qq.id===el.getAttribute('data-editq'));
    if(!q) return;
    QB_STATE = {
      editId: q.id,
      textEn: q.textEn, textHi: q.textHi,
      optType: q.optType,
      opts: q.options.map(o=> q.optType==='text' ? {en:o.en, hi:o.hi, img:null} : {en:'', hi:'', img:o.img}),
      correct: q.correct
    };
    patch({});
    window.scrollTo({top:0, behavior:'smooth'});
  }));
  const cancelBtn = document.getElementById('cancelEditBtn');
  if(cancelBtn) cancelBtn.addEventListener('click',()=>{ resetQB(); patch({}); });
  document.querySelectorAll('[data-opttype]').forEach(el=>el.addEventListener('click',()=>{
    QB_STATE.optType = el.getAttribute('data-opttype');
    document.getElementById('optBuilders').innerHTML = renderOptBuilders(ex&&ex.qLang);
    rebindOptBuilders();
    // re-render just the tabs active state
    document.querySelectorAll('[data-opttype]').forEach(t=>t.classList.toggle('active', t.getAttribute('data-opttype')===QB_STATE.optType));
  }));
  rebindOptBuilders();
  const f = document.getElementById('addQForm');
  function collectAndValidate(){
    const fd = new FormData(f);
    const qLang = (ex && ex.qLang) || 'both';
    /* pull whichever language field(s) this exam's mode actually shows;
       for a single-language exam, mirror the same text into both en/hi
       fields so the rest of the app (guard runner, review, export) keeps working */
    if(qLang==='both'){
      QB_STATE.textEn = fd.get('textEn').trim();
      QB_STATE.textHi = fd.get('textHi').trim();
    } else if(qLang==='hi'){
      QB_STATE.textHi = fd.get('textHi').trim();
      QB_STATE.textEn = QB_STATE.textHi;
    } else {
      QB_STATE.textEn = fd.get('textEn').trim();
      QB_STATE.textHi = QB_STATE.textEn;
    }
    if(QB_STATE.optType==='text'){
      if(qLang==='both'){
        if(QB_STATE.opts.some(o=>!o.en.trim()||!o.hi.trim())){ alert('Hindi and English text is required for all 4 options.'); return false; }
      } else if(qLang==='hi'){
        if(QB_STATE.opts.some(o=>!o.hi.trim())){ alert('Hindi text is required for all 4 options.'); return false; }
        QB_STATE.opts.forEach(o=>{ o.en = o.hi; });
      } else {
        if(QB_STATE.opts.some(o=>!o.en.trim())){ alert('English text is required for all 4 options.'); return false; }
        QB_STATE.opts.forEach(o=>{ o.hi = o.en; });
      }
    } else {
      if(QB_STATE.opts.some(o=>!o.img)){ alert('Upload an image for all 4 options.'); return false; }
    }
    return true;
  }
  /* Questions are always saved as drafts (unpublished) until the admin
     clicks the single "Done — publish all drafts" button above the list,
     which publishes every draft question in this exam at once.
     Editing an existing question keeps its current draft/live status. */
  function saveQuestion(){
    if(!collectAndValidate()) return;
    const isEdit = !!QB_STATE.editId;
    let publishedVal;
    if(isEdit){
      const existing = DB.questions.find(qq=>qq.id===QB_STATE.editId);
      publishedVal = existing ? isQPublished(existing) : false;
    } else {
      publishedVal = false;
    }
    if(isEdit){
      const q = DB.questions.find(qq=>qq.id===QB_STATE.editId);
      const updated = {
        textEn: QB_STATE.textEn, textHi: QB_STATE.textHi,
        optType: QB_STATE.optType,
        options: QB_STATE.opts.map(o=>QB_STATE.optType==='text'?{en:o.en.trim(),hi:o.hi.trim()}:{img:o.img}),
        correct: QB_STATE.correct,
        published: publishedVal
      };
      withBusy(f, async ()=>{
        const {ok,error} = await dbWrite(sb.from('questions').update(toSnake(updated)).eq('id', QB_STATE.editId));
        if(!ok) throw error;
        if(q) Object.assign(q, updated);
        resetQB();
        patch({});
        showConfirmToast('Question updated');
      });
    } else {
      const order = questionsForExam(S.adminExamId).length;
      const question = {
        id: uid('q'), examId: S.adminExamId, order,
        textEn: QB_STATE.textEn, textHi: QB_STATE.textHi,
        optType: QB_STATE.optType,
        options: QB_STATE.opts.map(o=>QB_STATE.optType==='text'?{en:o.en.trim(),hi:o.hi.trim()}:{img:o.img}),
        correct: QB_STATE.correct,
        published: publishedVal,
        createdAt: Date.now()
      };
      withBusy(f, async ()=>{
        const {ok,error} = await dbWrite(sb.from('questions').insert(toSnake(question)));
        if(!ok) throw error;
        DB.questions.push(question);
        resetQB();
        patch({});
        showConfirmToast('Question added as draft');
      });
    }
  }
  if(f) f.addEventListener('submit', e=>{ e.preventDefault(); saveQuestion(); });
  const publishAllBtn = document.getElementById('publishAllBtn');
  if(publishAllBtn) publishAllBtn.addEventListener('click', ()=>{
    const drafts = questionsForExam(S.adminExamId).filter(q=>!isQPublished(q));
    if(drafts.length===0) return;
    publishAllBtn.disabled = true; publishAllBtn.textContent = 'Publishing…';
    dbWrite(sb.from('questions').update({published:true}).in('id', drafts.map(q=>q.id))).then(({ok,error})=>{
      if(!ok){ console.error(error); alert('Publish failed.\n\n'+(error&&error.message?error.message:'Please try again.')); publishAllBtn.disabled=false; publishAllBtn.textContent='✓ Done — publish all drafts'; return; }
      drafts.forEach(q=>{ q.published = true; });
      patch({});
      showConfirmToast(`${drafts.length} draft question${drafts.length===1?'':'s'} published`);
    });
  });
}

function exportExamExcel(examId, monthId){
  const isAll = examId===RESULTS_ALL;
  const exList = isAll ? examsForMonth(monthId) : [examById(examId)].filter(Boolean);
  if(exList.length===0){ alert('Please select an exam.'); return; }
  const usedNames = new Set();
  const sheetName = (base)=>{
    let n = String(base||'Exam').replace(/[\\\/\?\*\[\]:]/g,' ').trim().slice(0,28) || 'Exam';
    let out = n, i = 2;
    while(usedNames.has(out.toLowerCase())){ out = n.slice(0,25) + ' ' + (i++); }
    usedNames.add(out.toLowerCase());
    return out;
  };
  const summaryHeader = ['Date','Time','Name','Gate Pass Number','Post','Mobile','Exam Type','Total Marks','Achieved Marks'];
  const summaryItems = [];
  const sheets = [];
  exList.forEach(ex=>{
    const attempts = DB.attempts.filter(a=>a.examId===ex.id).sort((a,b)=>a.submittedAt-b.submittedAt);
    if(attempts.length===0) return;
    const qs = questionsForExam(ex.id);
    const header = summaryHeader.slice();
    for(let i=0;i<qs.length;i++) header.push('Q'+(i+1)+' Selected');
    const rows = [header];
    attempts.forEach(a=>{
      const g = findGuard(a.guardMobile);
      const dt = fmtDateTime(a.submittedAt);
      const base = [dt.date, dt.time, g?g.name:a.guardMobile, g?g.gatePass:'-', g?g.post:'-', a.guardMobile, ex.examType||'-', a.total, a.score];
      summaryItems.push({t:a.submittedAt, row:base});
      const row = base.slice();
      qs.forEach((q,i)=> row.push(a.answers[i]!=null ? letter(a.answers[i]) : ''));
      rows.push(row);
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = header.map((h,i)=> i<9 ? {wch: Math.max(12,h.length+2)} : {wch:10});
    sheets.push({ name: isAll ? (ex.examType||ex.nameEn||ex.nameHi||'Exam') : (ex.nameEn||'Exam'), ws });
  });
  if(sheets.length===0){ alert(isAll ? 'There are no attempts for this month yet.' : 'There are no attempts for this exam yet.'); return; }
  const wb = XLSX.utils.book_new();
  if(isAll){
    /* first sheet = every attempt of the month in one list, then one detailed sheet per exam */
    const sumRows = [summaryHeader].concat(summaryItems.sort((a,b)=>a.t-b.t).map(x=>x.row));
    const sws = XLSX.utils.aoa_to_sheet(sumRows);
    sws['!cols'] = summaryHeader.map(h=>({wch: Math.max(12,h.length+2)}));
    XLSX.utils.book_append_sheet(wb, sws, sheetName('All exam types'));
  }
  sheets.forEach(sh=> XLSX.utils.book_append_sheet(wb, sh.ws, sheetName(sh.name)));
  const blob = new Blob([XLSX.write(wb,{bookType:'xlsx', type:'array'})], {type:'application/octet-stream'});
  let filename;
  if(isAll){
    const m = DB.months.find(x=>x.id===monthId);
    filename = ((m&&m.label?m.label:'month').replace(/[^a-z0-9]+/gi,'_')) + '_all_exam_results.xlsx';
  } else {
    filename = (((exList[0].nameEn||'').replace(/[^a-z0-9]+/gi,'_'))||'exam_results') + '_results.xlsx';
  }
  if(window.claude){
    claude.use('downloads').then(dl=>{
      if(!dl){ fallbackDownload(blob, filename); return; }
      dl.save({filename, data: blob}).catch(()=>fallbackDownload(blob, filename));
    }).catch(()=>fallbackDownload(blob, filename));
  } else {
    fallbackDownload(blob, filename);
  }
}
function fallbackDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

    const mobile = el.getAttribute('data-delguard');

    const attCount = allAttemptsForGuard(mobile).length;
    const resultsLine = attCount>0
      ? `\n\nAll ${attCount} exam result${attCount===1?'':'s'} of this person will also be deleted automatically — you do not need to delete them one by one.`

      if(attCount>0 && (!rAtt.data || rAtt.data.length===0)){
        throw { message:'The database did not delete this person\'s exam results (0 rows affected). This almost always means a Row Level Security (RLS) policy on the "attempts" table is blocking the delete — nothing was removed.' };
      }
      DB.attempts = DB.attempts.filter(a=>a.guardMobile!==mobile);

      if(!rG.ok){
        patch({});
        console.error(rG.error);
        alert('Their exam results were deleted, but the security person could not be removed.\n\n'+(rG.error&&rG.error.message?rG.error.message:'Please try again.'));
        return;
      }
      DB.guards = DB.guards.filter(x=>x.mobile!==mobile);
      patch({});
      showConfirmToast('Security person and all their results deleted', 'danger');
    }catch(error){
      console.error(error);
      alert('Delete failed.\n\n'+(error&&error.message?error.message:'Please try again.'));
      el.disabled = false;
    }
  }));
}
function exportMasterDataExcel(view){
  let header, dataRows, title;
  if(view==='registered'){
    const ranking = guardRanking();
    header = ['Rank','Name','Gate Pass Number','Mobile','Post','Achieved Marks','Total Marks','Percentage'];
    dataRows = ranking.map((r,i)=>[i+1, r.g.name, r.g.gatePass, r.g.mobile, r.g.post, r.achievedMarks, r.totalMarks, r.pct.toFixed(1)+'%']);
    title = 'Registered security person';
  } else {
    const { attend, notAttend } = masterDataAttendance();
    const list = view==='attend' ? attend : notAttend;
    if(view==='notattend'){
      const examsToCheck = masterDataExamsToCheck().examsToCheck;
      header = ['S.No.','Name','Gate Pass Number','Mobile','Post','Missed Exams'];
      dataRows = list.map((g,i)=>[i+1, g.name, g.gatePass, g.mobile, g.post, missedExamTypesFor(g.mobile, examsToCheck).join(', ') || '-']);
    } else {
      header = ['S.No.','Name','Gate Pass Number','Mobile','Post'];
      dataRows = list.map((g,i)=>[i+1, g.name, g.gatePass, g.mobile, g.post]);
    }
    title = view==='attend' ? 'Attend' : 'Not Attend';
  }
  if(dataRows.length===0){ alert('There is no data to export.'); return; }
  const rows = [header, ...dataRows];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = header.map(h=>({wch: Math.max(14,h.length+2)}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, title.slice(0,28));
  const blob = new Blob([XLSX.write(wb,{bookType:'xlsx', type:'array'})], {type:'application/octet-stream'});
  const filename = title.replace(/[^a-z0-9]+/gi,'_') + '_masterdata.xlsx';
  if(window.claude){
    claude.use('downloads').then(dl=>{
      if(!dl){ fallbackDownload(blob, filename); return; }
      dl.save({filename, data: blob}).catch(()=>fallbackDownload(blob, filename));
    }).catch(()=>fallbackDownload(blob, filename));
  } else {
    fallbackDownload(blob, filename);
  }
}

/* ---- live sync -------------------------------------------------------
   Root cause behind "sometimes it shows, sometimes it doesn't": DB was
   only ever fetched once, at first page load. Any change made from a
   different tab, browser or device (a new guard registering, an admin
   locking a month, a result being deleted) was invisible to everyone
   else until they did a full manual page reload.

   This keeps every screen live using two mechanisms:
   1. Supabase Realtime (a live Postgres change feed) for months, exams,
      questions and attempts — the moment any device writes a row, every
      other open tab/device is notified in well under a second and
      quietly refetches just that table.
   2. A fast 2-second poll of `guards_public` for registered security
      persons. Realtime can only watch actual tables, not views — and
      `guards_public` is deliberately a view (not the raw `guards`
      table) so that a guard's PIN hash never has to reach the browser.
      2 seconds reads as instant to a person, without ever putting PIN
      data on a live broadcast channel.

   Either way, a repaint only happens on screens where it cannot wipe
   out something the person is mid-way through typing (an open question
   editor, an in-progress exam, an unsaved PIN-reset form, etc are left
   untouched — they simply pick up the fresh data next time the person
   navigates there). A slow 30-second full refetch runs underneath both
   as a safety net in case the realtime connection ever drops silently
   (e.g. a flaky mobile network). ----------------------------------- */
function isSafeToRepaint(){
  if(['guard-dashboard','guard-month','guard-myexams'].includes(S.screen)) return true;
  if(S.screen==='admin-dashboard'){
    const tab = S.adminTab||'months';
    if(tab==='guardprofile') return !S.showResetPin; // don't wipe an in-progress PIN reset
    if(!['months','masterdata','results'].includes(tab)) return false; // exam/question editor has its own draft state
    if(S.adminMonthId || S.adminExamId) return false; // inside a month/exam drill-down with its own add-form
    return true;
  }
  return false;
}
const REFRESH_TIMERS = {};
const TABLE_REFETCH = {
  months:   async ()=>{ const {data,error}=await sb.from('months').select('*');   if(error) throw error; DB.months=(data||[]).map(toCamel); },
  exams:    async ()=>{ const {data,error}=await sb.from('exams').select('*');    if(error) throw error; DB.exams=(data||[]).map(toCamel); },
  questions:async ()=>{ const {data,error}=await sb.from('questions').select('*');if(error) throw error; DB.questions=(data||[]).map(toCamel); },
  attempts: async ()=>{ const {data,error}=await sb.from('attempts').select('*'); if(error) throw error; DB.attempts=(data||[]).map(toCamel); },
};
function scheduleTableRefresh(table){
  // debounce: a burst of changes to the same table (e.g. "publish all
  // drafts" touching many questions at once) triggers only one refetch
  clearTimeout(REFRESH_TIMERS[table]);
  REFRESH_TIMERS[table] = setTimeout(async ()=>{
    try{ await TABLE_REFETCH[table](); if(isSafeToRepaint()) render(); }
    catch(err){ console.error('live sync refresh failed for', table, err); }
  }, 120);
}
async function refreshMonthsFast(){
  try{ await TABLE_REFETCH.months(); if(isSafeToRepaint()) render(); }
  catch(err){ console.error('months refresh failed', err); }
}
async function refreshGuardsFast(){
  try{
    const {data,error} = await sb.from('guards_public').select('*');
    if(error) throw error;
    DB.guards = (data||[]).map(guardRowToObj);
    if(isSafeToRepaint()) render();
  }catch(err){ console.error('guard refresh failed', err); }
}
let FULL_REFRESH_IN_FLIGHT = false;
async function refreshEverything(){
  if(FULL_REFRESH_IN_FLIGHT) return;
  FULL_REFRESH_IN_FLIGHT = true;
  try{ await loadAllData(); if(isSafeToRepaint()) render(); }
  catch(err){ console.error('full refresh failed', err); }
  finally{ FULL_REFRESH_IN_FLIGHT = false; }
}
/* ---- live sync, scaled for many concurrent security persons ---------
   Realtime connections and the "guards" poll are kept ADMIN-ONLY. With
   50-100 guards potentially logged in at once, giving every single one
   of them a Realtime channel would (a) eat most of the free tier's
   200-connection budget just sitting idle, and (b) mean that every
   single exam submission broadcasts a "table changed" event to every
   other guard's browser too, each of whom would then needlessly refetch
   the whole attempts table — multiplying load exactly when it matters
   least (everyone mid-exam) and most when many people submit close
   together. None of that data (other guards' registrations, other
   guards' attempts, exam edits) is ever shown on a guard's own screen
   anyway, so guards simply don't need it pushed to them.
   Guards instead get a cheap, plain poll of just the small `months`
   table (a handful of rows — this is what drives the lock/unlock
   indicator) every few seconds, which reads as live to a person without
   ever opening a Realtime socket or refetching the larger tables. A
   slower full refresh underneath covers everyone as a safety net, so a
   guard still sees a newly-published exam or a fixed question within
   under a minute even without realtime. ----------------------------- */
let ADMIN_CHANNEL = null;
function syncAdminChannel(){
  const isAdmin = SESSION && SESSION.role==='admin';
  if(isAdmin && !ADMIN_CHANNEL){
    ADMIN_CHANNEL = sb.channel('vses-live-admin');
    Object.keys(TABLE_REFETCH).forEach(table=>{
      ADMIN_CHANNEL.on('postgres_changes', {event:'*', schema:'public', table}, ()=>scheduleTableRefresh(table));
    });
    ADMIN_CHANNEL.subscribe();
  } else if(!isAdmin && ADMIN_CHANNEL){
    sb.removeChannel(ADMIN_CHANNEL);
    ADMIN_CHANNEL = null;
  }
}
function startLiveSync(){
  syncAdminChannel();
  setInterval(()=>{
    syncAdminChannel(); // picks up login/logout without needing a page reload
    if(SESSION && SESSION.role==='admin') refreshGuardsFast();
    else refreshMonthsFast();
  }, 2000);
  setInterval(refreshEverything, 30000); // safety net for everyone (new exams, edits, and a fallback if Realtime ever drops for the admin)
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refreshEverything(); });
  window.addEventListener('focus', refreshEverything);
}
